u said that."}, {"t": "fix", "q": "He asked me where did I live.", "a": ["He asked me where I lived.", "He asked me where I live."], "w": "Reported question memakai urutan kalimat biasa, tanpa did."}, {"t": "fix", "q": "The doctor told me don't eat sweets.", "a": ["The doctor told me not to eat sweets."], "w": "Perintah negatif dilaporkan dengan not to + V1."}, {"t": "fix", "q": "She said that she will come the next day.", "a": ["She said that she would come the next day."], "w": "Will harus mundur menjadi would."}, {"t": "tr", "q": "Dia bilang bahwa dia sedang sibuk.", "a": ["He said that he was busy.", "She said that she was busy.", "He said he was busy.", "She said she was busy."], "w": "Present mundur menjadi was; that boleh dihilangkan."}, {"t": "tr", "q": "Ibu menyuruh saya membersihkan kamar.", "a": ["My mother told me to clean the room.", "My mother told me to clean my room.", "My mom told me to clean the room.", "My mom told me to clean my room.", "Mom told me to clean the room.", "Mom told me to clean my room."], "w": "Perintah dilaporkan dengan told + O + to + V1."}, {"t": "tr", "q": "Dia bertanya apakah saya mau ikut.", "a": ["He asked if I wanted to come.", "She asked if I wanted to come.", "He asked whether I wanted to come.", "She asked whether I wanted to come.", "He asked if I wanted to join.", "She asked if I wanted to join.", "He asked whether I wanted to join.", "She asked whether I wanted to join."], "w": "Pertanyaan ya/tidak memakai if atau whether, kata kerja mundur menjadi wanted."}, {"t": "tr", "q": "Mereka bilang mereka akan datang besok.", "a": ["They said they would come tomorrow.", "They said that they would come tomorrow.", "They said they would come the next day.", "They said that they would come the next day."], "w": "Will mundur menjadi would; tomorrow bisa tetap atau menjadi the next day."}]}, {"id": "g18", "title": "Phrasal Verbs & Pola Kalimat Lanjutan (separable/inseparable, inversion ringan, cleft 'It is ... that')", "lvl": 4, "explain": "Phrasal verb separable bisa dipisah objeknya (turn off the light / turn the light off); jika objek berupa pronomina wajib dipisah (turn it off). Inseparable tidak bisa dipisah (look after her). Inversion ringan: kata negatif di awal membalik subjek dan auxiliary (Never have I seen...). Cleft: It is/was + fokus + that/who + klausa.", "formula": ["V + object + particle / V + particle + noun (separable)", "V + particle + object (inseparable)", "Never/Rarely/Not only + auxiliary + S + V", "It is/was + fokus + that/who + klausa"], "examples": [["She turned the offer down.", "Dia menolak tawaran itu."], ["I found the key and picked it up.", "Saya menemukan kunci itu dan memungutnya."], ["She takes after her mother.", "Dia mirip ibunya."], ["Never have I seen such a big fish.", "Saya belum pernah melihat ikan sebesar itu."], ["Not only was he late, but he also forgot the documents.", "Dia tidak hanya terlambat, tetapi juga lupa dokumennya."], ["It was my sister who broke the vase.", "Kakak sayalah yang memecahkan vas itu."]], "mistakes": [["She picked up it from the floor.", "She picked it up from the floor.", "Objek pronomina wajib berada di antara verb dan particle pada separable phrasal verb."], ["Never I have been so happy.", "Never have I been so happy.", "Setelah kata negatif di awal kalimat, auxiliary harus mendahului subjek."], ["It was yesterday when I met her.", "It was yesterday that I met her.", "Pada kalimat cleft pakai that (atau who untuk orang), bukan when."], ["I ran into with my old teacher.", "I ran into my old teacher.", "Run into adalah inseparable dan sudah punya preposisi sendiri; jangan tambah with."]], "items": [{"t": "mcq", "q": "I saw the key and picked ___.", "o": ["up it", "it up", "up them", "them up"], "a": 1, "w": "Pronomina objek (it) harus diletakkan di antara pick dan up."}, {"t": "mcq", "q": "She takes ___ her mother; they both have curly hair.", "o": ["after", "off", "up", "out"], "a": 0, "w": "Take after berarti mirip dengan anggota keluarga."}, {"t": "mcq", "q": "We can't ___ with this noise any longer.", "o": ["put up", "put on", "put off", "put down"], "a": 0, "w": "Put up with berarti menoleransi."}, {"t": "mcq", "q": "Never ___ such a beautiful place.", "o": ["I have seen", "have I seen", "did I saw", "I saw"], "a": 1, "w": "Never di awal kalimat membuat auxiliary mendahului subjek: have I seen."}, {"t": "mcq", "q": "Not only ___ late, but he also forgot the documents.", "o": ["he was", "was he", "he is", "did he"], "a": 1, "w": "Not only di awal kalimat menyebabkan inversi: was he."}, {"t": "mcq", "q": "It was Rina ___ won the contest.", "o": ["that", "what", "whose", "where"], "a": 0, "w": "Kalimat cleft memakai that setelah bagian yang difokuskan."}, {"t": "mcq", "q": "Hardly ___ the house when it started to rain.", "o": ["had she left", "she had left", "she left", "did she left"], "a": 0, "w": "Hardly di awal memakai inversi dengan past perfect: had she left."}, {"t": "fill", "q": "I don't know this word. Let me look it ___ in the dictionary.", "a": ["up"], "w": "Look up berarti mencari informasi; pronomina it ada di tengah."}, {"t": "fill", "q": "Rarely ___ she eat fast food.", "a": ["does"], "w": "Rarely di awal kalimat membuat auxiliary mendahului subjek: does she eat."}, {"t": "fill", "q": "It was in Bandung ___ they first met.", "a": ["that"], "w": "Cleft pakai that untuk memfokuskan keterangan tempat."}, {"t": "fill", "q": "The plane took ___ at nine o'clock.", "a": ["off"], "w": "Take off berarti lepas landas."}, {"t": "order", "a": "She turned the offer down.", "id": "Dia menolak tawaran itu.", "alt": ["She turned down the offer."]}, {"t": "order", "a": "Never have I seen such a big fish.", "id": "Saya belum pernah melihat ikan sebesar itu."}, {"t": "order", "a": "It was my sister who broke the vase.", "id": "Kakak sayalah yang memecahkan vas itu.", "alt": ["It was my sister that broke the vase."]}, {"t": "fix", "q": "She picked up it from the floor.", "a": ["She picked it up from the floor."], "w": "Pronomina objek wajib berada di antara verb dan particle."}, {"t": "fix", "q": "Never I have been so happy.", "a": ["Never have I been so happy."], "w": "Setelah never di awal kalimat, auxiliary mendahului subjek."}, {"t": "fix", "q": "It was yesterday when I met her.", "a": ["It was yesterday that I met her."], "w": "Pada kalimat cleft pakai that, bukan when."}, {"t": "fix", "q": "I ran into with my old teacher.", "a": ["I ran into my old teacher."], "w": "Run into sudah mencakup preposisi; jangan tambah with."}, {"t": "tr", "q": "Tolong matikan lampunya.", "a": ["Please turn off the light.", "Please turn the light off.", "Please turn off the lights.", "Please turn the lights off.", "Please switch off the light.", "Please switch the light off.", "Please switch off the lights.", "Please switch the lights off."], "w": "Turn off adalah separable, jadi objek boleh di tengah atau setelah particle."}, {"t": "tr", "q": "Kami kehabisan susu.", "a": ["We ran out of milk.", "We have run out of milk.", "We've run out of milk."], "w": "Run out of berarti kehabisan; inseparable dan diikuti of."}, {"t": "tr", "q": "Ahmad-lah yang memecahkan jendela itu.", "a": ["It was Ahmad who broke the window.", "It was Ahmad that broke the window."], "w": "Kalimat cleft: It was + fokus + who/that + klausa."}]}, {"id": "g19", "title": "Question Forms & Question Words (Kalimat Tanya)", "lvl": 1, "explain": "Untuk membuat pertanyaan, letakkan kata bantu (do/does/did, am/is/are) sebelum subjek. Kata tanya: what (apa), where (di mana), when (kapan), why (mengapa), who (siapa), how (bagaimana). Setelah do/does/did, kata kerja kembali ke bentuk dasar (V1). Pertanyaan tentang subjek (Who lives here?) tidak memakai do/does/did.", "formula": ["Do/Does/Did + S + V1 + O?", "Question word + do/does/did + S + V1?", "Am/Is/Are + S + ...? / Question word + am/is/are + S?", "Who/What + V (s/es/past) + O?"], "examples": [["What do you want for lunch?", "Kamu mau makan siang apa?"], ["Where does she work?", "Dia bekerja di mana?"], ["When did they arrive?", "Kapan mereka tiba?"], ["Why are you late?", "Kenapa kamu terlambat?"], ["Who lives next door?", "Siapa yang tinggal di sebelah?"], ["How do you go to school?", "Bagaimana kamu pergi ke sekolah?"]], "mistakes": [["Where you live?", "Where do you live?", "Pertanyaan dengan kata kerja biasa butuh do/does/did setelah kata tanya."], ["What does she wants?", "What does she want?", "Setelah does kata kerja kembali ke bentuk dasar, tanpa -s."], ["Did you went to the party?", "Did you go to the party?", "Setelah did kata kerja memakai V1, bukan bentuk lampau."], ["Who does live here?", "Who lives here?", "Jika who adalah subjek, tidak perlu do/does; kata kerja langsung mengikuti who."]], "items": [{"t": "mcq", "q": "___ you like pizza?", "o": ["Do", "Does", "Are", "Is"], "a": 0, "w": "Subjek you memakai do untuk pertanyaan simple present."}, {"t": "mcq", "q": "___ is your birthday? It is in May.", "o": ["When", "Where", "Who", "Why"], "a": 0, "w": "Jawabannya menyebut waktu (bulan), jadi memakai when."}, {"t": "mcq", "q": "Does he ___ English?", "o": ["speak", "speaks", "speaking", "spoke"], "a": 0, "w": "Setelah does kata kerja memakai bentuk dasar."}, {"t": "mcq", "q": "___ did you go yesterday? To the market.", "o": ["Where", "Who", "Why", "When"], "a": 0, "w": "Jawabannya menyebut tempat, jadi memakai where."}, {"t": "mcq", "q": "___ is that man? He is my uncle.", "o": ["Who", "What", "When", "How"], "a": 0, "w": "Menanyakan orang dipakai who."}, {"t": "mcq", "q": "___ did they leave early? Because they were tired.", "o": ["Why", "Who", "Where", "How"], "a": 0, "w": "Jawaban dengan because menjelaskan alasan, jadi memakai why."}, {"t": "fill", "q": "___ your brother play football on Sundays?", "a": ["does"], "w": "Subjek orang ketiga tunggal (your brother) memakai does."}, {"t": "fill", "q": "___ she watch a movie last night?", "a": ["did"], "w": "Last night menunjukkan lampau, jadi memakai did."}, {"t": "fill", "q": "___ (be) your parents at home now?", "a": ["are"], "w": "Your parents jamak, dan kalimat tanpa kata kerja lain memakai are."}, {"t": "order", "a": "Where does your sister work?", "id": "Saudara perempuanmu bekerja di mana?"}, {"t": "order", "a": "What did she buy yesterday?", "id": "Apa yang dia beli kemarin?"}, {"t": "fix", "q": "How you go to work every day?", "a": ["How do you go to work every day?"], "w": "Pertanyaan simple present dengan kata kerja biasa butuh do setelah how."}, {"t": "fix", "q": "Does she likes coffee?", "a": ["Does she like coffee?"], "w": "Setelah does kata kerja tidak memakai -s."}, {"t": "fix", "q": "Did you saw him yesterday?", "a": ["Did you see him yesterday?"], "w": "Setelah did kata kerja memakai V1 (see), bukan saw."}, {"t": "tr", "q": "Kamu tinggal di mana?", "a": ["Where do you live?", "Where are you living?"], "w": "Gunakan where + do + you + V1."}, {"t": "tr", "q": "Kenapa dia sedih?", "a": ["Why is she sad?", "Why is he sad?"], "w": "Sad adalah kata sifat, jadi memakai why + is + subjek."}, {"t": "tr", "q": "Apakah kamu suka musik?", "a": ["Do you like music?", "Do you love music?"], "w": "Pertanyaan ya/tidak simple present memakai do + you + V1."}]}, {"id": "g20", "title": "Gerunds & Infinitives (Kata Kerja + V-ing / to V)", "lvl": 3, "explain": "Setelah kata kerja tertentu, kata kerja kedua berbentuk gerund (V-ing) atau infinitive (to V1). Gerund: enjoy, avoid, finish, mind, keep, suggest. Infinitive: want, decide, hope, plan, promise, refuse. Setelah preposisi selalu V-ing. Like/love/start boleh keduanya. Stop, remember, forget berubah arti.", "formula": ["S + enjoy/avoid/finish/mind/keep/suggest + V-ing", "S + want/decide/hope/plan/promise/refuse + to + V1", "Preposition + V-ing (good at, tired of, look forward to)", "S + like/love/start/begin + V-ing atau to V1"], "examples": [["She enjoys reading before bed.", "Dia suka membaca sebelum tidur."], ["I want to learn how to cook.", "Saya ingin belajar cara memasak."], ["He decided to move to Bandung.", "Dia memutuskan pindah ke Bandung."], ["They finished painting the room.", "Mereka selesai mengecat ruangan itu."], ["I'm looking forward to seeing you.", "Saya menantikan bertemu denganmu."], ["She stopped to buy some milk.", "Dia berhenti untuk membeli susu."]], "mistakes": [["I enjoy to swim on weekends.", "I enjoy swimming on weekends.", "Enjoy harus diikuti gerund (V-ing), bukan to + V1."], ["She wants going home.", "She wants to go home.", "Want diikuti infinitive (to + V1), bukan V-ing."], ["He is good at to cook.", "He is good at cooking.", "Setelah preposisi (at) pakai V-ing, bukan to + V1."], ["I look forward to see you.", "I look forward to seeing you.", "Pada look forward to, kata to adalah preposisi, jadi diikuti V-ing."]], "items": [{"t": "mcq", "q": "She enjoys ___ music.", "o": ["listen", "listening", "to listen", "listened"], "a": 1, "w": "Enjoy diikuti gerund (V-ing)."}, {"t": "mcq", "q": "We decided ___ a taxi.", "o": ["take", "taking", "to take", "took"], "a": 2, "w": "Decide diikuti infinitive (to + V1)."}, {"t": "mcq", "q": "He avoided ___ about the problem.", "o": ["talk", "to talk", "talking", "talked"], "a": 2, "w": "Avoid diikuti gerund (V-ing)."}, {"t": "mcq", "q": "She is good at ___ new languages.", "o": ["learn", "to learn", "learning", "learned"], "a": 2, "w": "Setelah preposisi at dipakai V-ing."}, {"t": "mcq", "q": "I forgot ___ the door, so someone came in.", "o": ["lock", "locking", "to lock", "locked"], "a": 2, "w": "Forget + to V artinya lupa melakukan sesuatu yang seharusnya dilakukan."}, {"t": "mcq", "q": "They promised ___ late again.", "o": ["not be", "not to be", "don't be", "not being"], "a": 1, "w": "Promise diikuti infinitive; bentuk negatifnya not to + V1."}, {"t": "fill", "q": "I don't mind ___ (wait) for you.", "a": ["waiting"], "w": "Mind diikuti gerund (V-ing)."}, {"t": "fill", "q": "She hopes ___ (win) the prize.", "a": ["to win"], "w": "Hope diikuti infinitive (to + V1)."}, {"t": "fill", "q": "Thank you for ___ (help) me.", "a": ["helping"], "w": "Setelah preposisi for dipakai V-ing."}, {"t": "order", "a": "He refused to answer the question.", "id": "Dia menolak menjawab pertanyaan itu."}, {"t": "order", "a": "She kept working until midnight.", "id": "Dia terus bekerja sampai tengah malam."}, {"t": "fix", "q": "He suggested to go to the cinema.", "a": ["He suggested going to the cinema."], "w": "Suggest diikuti gerund (V-ing), bukan to + V1."}, {"t": "fix", "q": "They are planning visiting Bali next month.", "a": ["They are planning to visit Bali next month."], "w": "Plan diikuti infinitive (to + V1)."}, {"t": "fix", "q": "She is tired of to do the same work.", "a": ["She is tired of doing the same work."], "w": "Setelah preposisi of dipakai V-ing."}, {"t": "tr", "q": "Saya ingin belajar menyetir.", "a": ["I want to learn to drive.", "I want to learn how to drive.", "I want to learn driving."], "w": "Want + to + V1; learn juga diikuti to + V1."}, {"t": "tr", "q": "Dia menikmati berenang di laut.", "a": ["She enjoys swimming in the sea.", "He enjoys swimming in the sea.", "She enjoys swimming in the ocean.", "He enjoys swimming in the ocean."], "w": "Enjoy diikuti gerund (swimming)."}, {"t": "tr", "q": "Mereka berhenti merokok tahun lalu.", "a": ["They stopped smoking last year.", "They quit smoking last year."], "w": "Stop + V-ing artinya berhenti melakukan kebiasaan; quit juga diikuti V-ing."}]}];
const READ=[{"id": "r01", "title": "My Family", "lvl": 0, "text": "My name is Rina. I have a small family. I live with my mother, my father and my little brother. My brother is six years old. He likes cats. Every morning we eat breakfast together. We eat rice and eggs.", "qs": [{"q": "Who does Rina live with?", "o": ["Her aunt and uncle", "Her mother, father and brother", "Her grandmother only", "Her friends"], "a": 1, "w": "Teks: 'I live with my mother, my father and my little brother.'"}, {"q": "How old is Rina's brother?", "o": ["Four", "Five", "Six", "Seven"], "a": 2, "w": "Teks menyebut 'My brother is six years old.'"}, {"q": "What does Rina's brother like?", "o": ["Birds", "Fish", "Dogs", "Cats"], "a": 3, "w": "Teks: 'He likes cats.'"}, {"q": "When does the family eat together?", "o": ["In the morning", "At night", "At lunch", "Only on Sunday"], "a": 0, "w": "Teks: 'Every morning we eat breakfast together.'"}]}, {"id": "r02", "title": "A Day at School", "lvl": 0, "text": "Today is Monday. Budi goes to school by bike. His school is near his house. He has English class at eight o'clock. He likes his English teacher because she is kind. After school, he plays football with his friends.", "qs": [{"q": "How does Budi go to school?", "o": ["By bus", "On foot", "By bike", "By car"], "a": 2, "w": "Teks: 'Budi goes to school by bike.'"}, {"q": "When is the English class?", "o": ["At seven", "At eight", "At nine", "At ten"], "a": 1, "w": "Teks: 'English class at eight o'clock.'"}, {"q": "Why does Budi like his English teacher?", "o": ["She is kind", "She is funny", "She is young", "She gives no homework"], "a": 0, "w": "Teks: 'because she is kind.'"}, {"q": "What do we know about Budi's school?", "o": ["It is far from his house", "It is closed on Monday", "It is in another city", "It is close to his home"], "a": 3, "w": "'Near his house' berarti dekat dengan rumahnya."}]}, {"id": "r03", "title": "Train to Yogyakarta", "lvl": 1, "text": "Last Saturday, Dewi and her family went to Yogyakarta by train. The trip took about eight hours, so they left Jakarta at ten in the morning. Dewi sat next to the window and looked at the rice fields. At noon they ate fried rice from a small bag. When they arrived, it was already dark. They stayed in a cheap hotel near Malioboro Street. Dewi was tired, but she was very happy.", "qs": [{"q": "How did Dewi's family travel?", "o": ["By plane", "By bus", "By car", "By train"], "a": 3, "w": "Teks: 'went to Yogyakarta by train.'"}, {"q": "What did they eat at noon?", "o": ["Fried rice", "Noodles in a restaurant", "Bread", "Fruit"], "a": 0, "w": "Teks: 'At noon they ate fried rice from a small bag.'"}, {"q": "About what time did they arrive?", "o": ["Around two in the afternoon", "Around six in the evening", "Around midnight", "Around eight in the morning"], "a": 1, "w": "Berangkat pukul 10 pagi + 8 jam = sekitar pukul 6 sore, dan sudah gelap."}, {"q": "Where did Dewi sit on the train?", "o": ["Next to the window", "Next to the door", "Near the toilet", "In the food car"], "a": 0, "w": "Teks: 'Dewi sat next to the window.'"}]}, {"id": "r04", "title": "Andi's New Phone", "lvl": 1, "text": "Andi has a new phone. He bought it with money from his part-time job. The phone is not expensive, but it has a good camera. Andi takes many photos of his cat. He also uses the phone to study English with a free app. He is proud of it. His mother says he must not play games at night, so he turns the phone off at nine o'clock.", "qs": [{"q": "How did Andi pay for the phone?", "o": ["His mother gave him money", "He sold his old phone", "He won a contest", "He used money from his part-time job"], "a": 3, "w": "Teks: 'He bought it with money from his part-time job.'"}, {"q": "What does Andi take photos of?", "o": ["His friends", "His cat", "Food", "Flowers"], "a": 1, "w": "Teks: 'Andi takes many photos of his cat.'"}, {"q": "Why does Andi turn off his phone at nine o'clock?", "o": ["The battery is weak", "His mother does not want him to play games at night", "The English app closes", "He is angry"], "a": 1, "w": "Teks: ibunya melarang bermain game pada malam hari."}, {"q": "What kind of phone does Andi have?", "o": ["A very expensive phone", "A borrowed phone", "An affordable phone with a good camera", "An old phone with a bad camera"], "a": 2, "w": "Teks: 'not expensive, but it has a good camera.'"}]}, {"id": "r05", "title": "Healthy Habits", "lvl": 1, "text": "Doctor Sari tells her patients to drink eight glasses of water every day. Water helps the body stay cool and clean. She also says that people should sleep for at least seven hours. Many students sleep only five hours because they use their phones late at night. This is not good. In the morning, they feel tired and cannot think well. A short walk after dinner is also a good habit.", "qs": [{"q": "How much water does Doctor Sari recommend every day?", "o": ["Six glasses", "Seven glasses", "Eight glasses", "Ten glasses"], "a": 2, "w": "Teks: 'drink eight glasses of water every day.'"}, {"q": "Why do many students sleep only five hours?", "o": ["They study all night", "They work at a shop", "They drink too much water", "They use their phones late at night"], "a": 3, "w": "Teks: 'because they use their phones late at night.'"}, {"q": "How do students feel in the morning if they sleep too little?", "o": ["Hungry", "Happy", "Tired", "Cold"], "a": 2, "w": "Teks: 'they feel tired and cannot think well.'"}, {"q": "What does the doctor suggest after dinner?", "o": ["A short walk", "A long nap", "A cold drink", "Phone games"], "a": 0, "w": "Teks: 'A short walk after dinner is also a good habit.'"}]}, {"id": "r06", "title": "A Nurse's Day", "lvl": 2, "text": "Maya works as a nurse at a small clinic in Bandung. Her shift starts at seven in the morning, but she usually arrives thirty minutes early to prepare the rooms. She checks patients' temperature and blood pressure, and she writes the results in a book. Although the work is tiring, she enjoys helping people. Last week, an old man came to the clinic because he felt dizzy. Maya asked him to sit down and gave him some water. Then she called the doctor immediately. The doctor said the man had not eaten breakfast, and he needed rest. The man thanked Maya before he went home. She felt proud, even though she had not had time for lunch.", "qs": [{"q": "What time does Maya usually arrive at the clinic?", "o": ["At seven", "At six thirty", "At six", "At seven thirty"], "a": 1, "w": "Shift mulai pukul 7 dan ia datang 30 menit lebih awal, yaitu pukul 6.30."}, {"q": "Why did the old man feel dizzy?", "o": ["He had a fever", "He was too old to walk", "He had not eaten breakfast", "He did not take his medicine"], "a": 2, "w": "Dokter berkata ia belum sarapan."}, {"q": "What did Maya do when the old man arrived?", "o": ["She wrote in the book and went home", "She gave him lunch", "She sent him to another clinic", "She asked him to sit and gave him water"], "a": 3, "w": "Teks: 'asked him to sit down and gave him some water.'"}, {"q": "What can we infer about Maya?", "o": ["She dislikes her job", "She cares about her patients", "She wants to become a doctor", "She is always late"], "a": 1, "w": "Ia menikmati membantu orang dan bangga setelah menolong, jadi ia peduli pada pasien."}]}, {"id": "r07", "title": "The Motorcycle That Would Not Start", "lvl": 2, "text": "Pak Joko owns a motorcycle workshop near the market. Yesterday a customer brought in a motorcycle that would not start. First, Pak Joko checked the battery, and it was fine. Then he looked at the spark plug and found that it was black and dirty. He cleaned it, but the engine still sounded weak. Finally, his assistant, Dito, noticed that the air filter was full of dust. After they replaced it, the motorcycle started easily and ran smoothly. Pak Joko told the customer to change the air filter every six months, especially in the dry season when the roads are dusty. The customer paid and promised to come back for a regular service next month.", "qs": [{"q": "What was wrong with the spark plug?", "o": ["It was broken in two", "It was missing", "It was too new", "It was black and dirty"], "a": 3, "w": "Teks: 'black and dirty.'"}, {"q": "Who found the main problem?", "o": ["Pak Joko", "The customer", "Dito", "Another mechanic"], "a": 2, "w": "Dito, asisten, yang menyadari filter udara penuh debu."}, {"q": "Why should the air filter be changed often?", "o": ["Dusty roads make it dirty quickly", "It is very cheap", "The battery is weak", "The engine is new"], "a": 0, "w": "Terutama di musim kemarau saat jalan berdebu."}, {"q": "What will the customer probably do next month?", "o": ["Sell the motorcycle", "Buy a new battery", "Come back for a regular service", "Open a workshop"], "a": 2, "w": "Teks: ia berjanji kembali untuk servis rutin bulan depan."}]}, {"id": "r08", "title": "Sundays with Grandmother", "lvl": 2, "text": "Every Sunday, our family visits my grandmother in a village near Malang. We leave early because the road is often busy. My grandmother lives alone, but her neighbors help her with shopping and cleaning. When we arrive, she is usually in the kitchen, making her famous chicken soup. My cousins come too, so the house becomes noisy and warm. After lunch, my father and uncle fix things around the house, such as the old fence or the leaking roof. My mother and aunts talk about recipes. I like to sit with my grandmother and listen to her stories about the past. I hope she stays healthy for many more years.", "qs": [{"q": "Why does the family leave early?", "o": ["Grandmother wakes up late", "They want to go shopping", "The road is often busy", "The village is very far away"], "a": 2, "w": "Teks: 'because the road is often busy.'"}, {"q": "Who helps the grandmother with shopping and cleaning?", "o": ["Her neighbors", "Her cousins", "Her sons", "A maid"], "a": 0, "w": "Teks: 'her neighbors help her.'"}, {"q": "What do the men do after lunch?", "o": ["They cook soup", "They repair things at the house", "They talk about recipes", "They visit the neighbors"], "a": 1, "w": "Ayah dan paman memperbaiki pagar dan atap bocor."}, {"q": "What can we infer about the writer?", "o": ["The writer finds the visits boring", "The writer lives with the grandmother", "The writer is a cook", "The writer is close to the grandmother"], "a": 3, "w": "Ia suka duduk mendengarkan cerita nenek dan berharap nenek sehat."}]}, {"id": "r09", "title": "Quiet Hour", "lvl": 3, "text": "Last month, our school started a new program called \"Quiet Hour.\" Every Wednesday, from one to two o'clock, students must put their phones in a box at the front of the classroom and spend an hour reading, writing, or studying on their own. At first, most students complained because they thought it was boring. However, after three weeks, many of them changed their minds. Ms. Hartati, the principal, explained that the program was not meant to punish anyone. She wanted students to learn how to concentrate without being interrupted by messages and videos. Some students admitted that they had finished more homework during Quiet Hour than at home. Others said they discovered interesting books in the library for the first time. Not everyone is satisfied, though. A few students worry about emergencies and ask whether parents can call the school office instead. The principal has promised to consider this suggestion.", "qs": [{"q": "What must students do with their phones during Quiet Hour?", "o": ["Turn them off at home", "Give them to the principal", "Use them to read", "Put them in a box in the classroom"], "a": 3, "w": "Teks: ponsel dimasukkan ke dalam kotak di depan kelas."}, {"q": "Why did the principal start the program?", "o": ["To punish students who use phones", "To help students concentrate", "To sell more books", "To shorten the school day"], "a": 1, "w": "Ia ingin siswa belajar berkonsentrasi tanpa gangguan."}, {"q": "How did most students feel at first?", "o": ["They complained because it was boring", "They were excited", "They were confused", "They stayed silent"], "a": 0, "w": "Teks: 'At first, most students complained.'"}, {"q": "What are some students worried about?", "o": ["Losing their phones", "Too much homework", "Not being reachable in an emergency", "The books being too difficult"], "a": 2, "w": "Mereka khawatir soal keadaan darurat dan ingin orang tua bisa menelepon kantor sekolah."}]}, {"id": "r10", "title": "Why Is the Sky Blue?", "lvl": 3, "text": "Have you ever wondered why the sky is blue? Sunlight looks white, but it is actually a mixture of many colors. When sunlight enters the Earth's atmosphere, it hits tiny gas particles in the air. Blue light has a short wavelength, so it is scattered in all directions much more than red light. This is why we see blue light coming from every part of the sky. At sunrise and sunset, the sun is low, and its light must travel through more air to reach our eyes. Most of the blue light is scattered away before it arrives, so the sky near the sun looks orange or red. Interestingly, the same idea explains why the sky on the Moon is black. The Moon has almost no atmosphere, so there is nothing to scatter the sunlight. Scientists call this effect Rayleigh scattering.", "qs": [{"q": "What is sunlight actually?", "o": ["Only white light", "A mixture of many colors", "Only blue light", "Heat without light"], "a": 1, "w": "Teks: 'a mixture of many colors.'"}, {"q": "Why does the sky near the sun look red at sunset?", "o": ["Most blue light is scattered away before it reaches us", "The sun becomes hotter", "Clouds make red light", "The air is cleaner"], "a": 0, "w": "Cahaya harus menempuh lebih banyak udara sehingga cahaya biru tersebar lebih dulu."}, {"q": "Why is the sky on the Moon black?", "o": ["It is too far from the Sun", "Its dust absorbs blue light", "It has many dark clouds", "It has almost no atmosphere"], "a": 3, "w": "Bulan hampir tidak punya atmosfer untuk menyebarkan cahaya."}, {"q": "Compared with red light, blue light is...", "o": ["scattered less", "scattered more", "not scattered at all", "completely absorbed"], "a": 1, "w": "Teks: blue light 'is scattered ... much more than red light.'"}]}, {"id": "r11", "title": "New Electric Bus Line", "lvl": 3, "text": "A new bus line opened in the city of Surabaya on Monday. The line connects the main train station with the airport and runs every fifteen minutes from five in the morning until ten at night. According to the mayor, the buses use electricity instead of diesel, which will reduce air pollution in the busy city center. A ticket costs ten thousand rupiah, but students and elderly passengers pay only half. During the first week, the service is free so that residents can try it. On opening day, more than three thousand people rode the buses, and many said the seats were comfortable and the air conditioning worked well. However, some passengers complained that the bus stops had no roofs and were hot at noon. City officials said they would build shelters before the end of the year. Taxi drivers near the airport are worried that they may lose customers.", "qs": [{"q": "How often does the bus run?", "o": ["Every five minutes", "Every ten minutes", "Every fifteen minutes", "Every thirty minutes"], "a": 2, "w": "Teks: 'every fifteen minutes.'"}, {"q": "Why do the buses use electricity?", "o": ["To reduce air pollution", "To make tickets cheaper", "To avoid traffic", "To run at night"], "a": 0, "w": "Menurut wali kota, ini akan mengurangi polusi udara."}, {"q": "How much will a student pay after the free week?", "o": ["Nothing", "Five thousand rupiah", "Ten thousand rupiah", "Fifteen thousand rupiah"], "a": 1, "w": "Tiket 10.000 dan pelajar bayar setengah, yaitu 5.000."}, {"q": "What did some passengers complain about?", "o": ["The seats were hard", "The buses were late", "The tickets were expensive", "The bus stops had no roofs"], "a": 3, "w": "Teks: halte tidak beratap dan panas saat siang."}]}, {"id": "r12", "title": "Lessons from Lombok", "lvl": 4, "text": "When I first planned my trip to Lombok, I expected a quiet holiday on the beach. Instead, I spent most of my time walking, climbing, and talking with local people. On the second day, my guide, Pak Rudi, suggested that I visit a traditional Sasak village, which I would never have found by myself. The houses there have floors made from a mixture of clay and buffalo dung, and although this sounds unpleasant, the floors are smooth, cool, and surprisingly clean. A woman showed me how she weaves cloth by hand. She said that each pattern has a meaning, and that a girl is traditionally expected to learn weaving before she gets married. I bought a small scarf, not only because it was beautiful, but also because I wanted the money to go directly to her family. On the last day, I tried to climb a hill to watch the sunrise, but heavy clouds covered the sky. I was disappointed at first. Pak Rudi laughed and told me that the best moments of a journey are rarely the ones we plan. Looking back, I think he was right.", "qs": [{"q": "What did the writer expect before the trip?", "o": ["An adventurous journey", "A quiet beach holiday", "A cultural study tour", "A shopping trip"], "a": 1, "w": "Teks: 'I expected a quiet holiday on the beach.'"}, {"q": "Why did the writer buy the scarf?", "o": ["It was very cheap", "The guide asked him to", "To support the weaver's family directly", "To give it to a bride"], "a": 2, "w": "Ia ingin uangnya langsung sampai ke keluarga penenun."}, {"q": "Why did the writer not see the sunrise?", "o": ["Heavy clouds covered the sky", "The writer overslept", "The hill was closed", "The guide was late"], "a": 0, "w": "Teks: 'heavy clouds covered the sky.'"}, {"q": "What did Pak Rudi mean by his last comment?", "o": ["Travelers should always follow a plan", "Sunrises are not worth watching", "A good guide can fix any problem", "Unplanned moments are often the most memorable"], "a": 3, "w": "Momen terbaik perjalanan jarang yang direncanakan, jadi momen tak terduga paling berkesan."}]}, {"id": "r13", "title": "The Sitting Problem", "lvl": 4, "text": "For many office workers, sitting for eight hours a day has become normal. Doctors, however, warn that this habit may be as harmful as smoking. A recent study followed two thousand employees in Jakarta for three years. Those who sat for more than seven hours a day without breaks were more likely to suffer from back pain, headaches, and high blood pressure. Surprisingly, the study also found that exercising for thirty minutes after work did not completely remove these risks. The researchers concluded that regular movement during the day matters more than a single workout in the evening. They recommended that workers stand up every hour, take the stairs instead of the elevator, and hold short meetings while walking. Some companies have already followed this advice. One bank in Jakarta replaced several desks with standing tables and noticed that its staff reported feeling more energetic in the afternoon. Even so, many employees admit that they forget to move when they are busy, which is why a few of them now use phone alarms as reminders. The researchers hope that employers will treat this as a workplace safety issue, not just a personal choice.", "qs": [{"q": "How long did the study follow the employees?", "o": ["One year", "Two years", "Three years", "Five years"], "a": 2, "w": "Teks: 'for three years.'"}, {"q": "What did the study find about exercising after work?", "o": ["It removed all the health risks", "It did not completely remove the risks", "It made the problems worse", "It helped only young workers"], "a": 1, "w": "Teks: olahraga 30 menit 'did not completely remove these risks.'"}, {"q": "According to the researchers, what matters more?", "o": ["Regular movement throughout the day", "One long workout in the evening", "Eating less food", "Working fewer days"], "a": 0, "w": "Teks: gerak teratur sepanjang hari lebih penting daripada satu sesi olahraga."}, {"q": "What can we infer from the bank's change?", "o": ["It made employees sit longer", "The staff asked for the old desks", "It saved the bank money", "It seemed to help staff feel more energetic"], "a": 3, "w": "Staf melaporkan merasa lebih berenergi di sore hari setelah ada meja berdiri."}]}, {"id": "r14", "title": "Who Remembers for You?", "lvl": 5, "text": "Over the past decade, smartphones have quietly changed the way we remember things. A few years ago, most people could recite at least a handful of phone numbers by heart; today, many of us struggle to recall even our own family members' numbers, because our contacts list does the remembering for us. Psychologists call this tendency \"cognitive offloading\": we store information in a device so that our brains can be used for other tasks. On the one hand, this seems efficient. Nobody would argue that memorising a bus timetable is a good use of mental energy when an app can display it instantly. On the other hand, some researchers fear that the habit has a hidden cost. In one experiment, volunteers who took photographs of paintings in a museum remembered fewer details afterwards than those who simply looked at them. The explanation, the researchers suggested, is that people assume the camera will remember for them, so they pay less attention in the moment. This does not mean that technology is the enemy of memory. Rather, it suggests that we should decide deliberately what to hand over to our devices and what to keep in our own heads. A shopping list may belong on the phone; the face of a new friend, or the lesson from a difficult day, probably does not. After all, a tool is useful only when we remain in charge of it.", "qs": [{"q": "What is \"cognitive offloading\"?", "o": ["Deleting unnecessary files to save space", "Practising memory with games", "Storing information in a device to free the brain for other tasks", "Learning to read faster"], "a": 2, "w": "Teks: 'we store information in a device so that our brains can be used for other tasks.'"}, {"q": "Why did volunteers who photographed paintings remember fewer details?", "o": ["They disliked art", "They paid less attention because the camera would remember", "They had less time in the museum", "They were older than the others"], "a": 1, "w": "Peneliti menjelaskan orang mengira kamera akan mengingat sehingga kurang memperhatikan."}, {"q": "What is the writer's main message?", "o": ["We should consciously choose what to leave to our devices", "Phones should be banned from museums", "Memory cannot be improved", "Old methods are always better"], "a": 0, "w": "Penulis menyarankan kita menentukan secara sadar apa yang diserahkan ke perangkat."}, {"q": "Which would the writer most likely want us to keep in our own memory?", "o": ["A bus timetable", "A shopping list", "The address of a shop", "The face of a new friend"], "a": 3, "w": "Teks: wajah teman baru 'probably does not' belong on the phone."}]}, {"id": "r15", "title": "Electric or Petrol?", "lvl": 5, "text": "Choosing between an electric car and a petrol car is rarely as simple as advertisements suggest. Electric vehicles have fewer moving parts, so they need less routine maintenance: there are no oil changes, no spark plugs, and the brakes last longer because the motor itself slows the car down. Owners in cities with reliable charging stations often save a considerable amount on fuel. Nevertheless, the purchase price is still higher in most countries, and a replacement battery can cost as much as a small second-hand car. This worries buyers who plan to keep a vehicle for more than ten years. Mechanics raise a different concern. Many workshops, especially in smaller towns, lack the equipment and training needed to repair high-voltage systems safely, so owners may have to travel far for even a minor fault. Petrol cars, by contrast, can be fixed almost anywhere, and spare parts are cheap and widely available. A mechanic named Hendra, who has worked on engines for twenty years, puts it this way: \"A good car is not the one with the newest technology, but the one you can keep running without stress.\" His advice is to consider where you live, how far you drive each day, and whether you have a place to charge at home before making a decision. In other words, the best choice depends less on the car than on the driver's circumstances.", "qs": [{"q": "Why do electric cars need less routine maintenance?", "o": ["They are smaller than petrol cars", "Their batteries never wear out", "They do not have brakes", "They have fewer moving parts"], "a": 3, "w": "Teks: 'fewer moving parts, so they need less routine maintenance.'"}, {"q": "What worries buyers who plan to keep a car for over ten years?", "o": ["A replacement battery can be very expensive", "Spare parts are too cheap", "Fuel prices are rising", "Electric cars are too slow"], "a": 0, "w": "Baterai pengganti bisa semahal mobil bekas kecil."}, {"q": "Why might owners in small towns travel far for repairs?", "o": ["Mechanics refuse to touch electric cars", "Many workshops lack equipment and training for high-voltage systems", "Electric cars are too heavy to tow", "There are no roads"], "a": 1, "w": "Banyak bengkel di kota kecil tidak punya alat dan pelatihan sistem tegangan tinggi."}, {"q": "What is Hendra's opinion?", "o": ["The newest technology is always best", "Petrol cars should be banned", "A good car is one you can keep running without stress", "Nobody should buy an electric car"], "a": 2, "w": "Kutipannya: mobil bagus adalah yang bisa terus dijalankan tanpa stres."}]}];
const PT=[{"lvl": 0, "skill": "grammar", "q": "I ___ a student.", "o": ["am", "is", "are", "be"], "a": 0, "w": "Subjek I memakai am."}, {"lvl": 0, "skill": "grammar", "q": "She ___ my sister.", "o": ["am", "are", "is", "be"], "a": 2, "w": "Subjek she memakai is."}, {"lvl": 0, "skill": "grammar", "q": "This is ___ apple.", "o": ["a", "an", "two", "some"], "a": 1, "w": "Kata benda berawalan bunyi vokal memakai an."}, {"lvl": 0, "skill": "grammar", "q": "They ___ from Indonesia.", "o": ["is", "am", "be", "are"], "a": 3, "w": "Subjek they memakai are."}, {"lvl": 0, "skill": "grammar", "q": "What ___ your name?", "o": ["am", "is", "are", "do"], "a": 1, "w": "Your name (tunggal) memakai is: What is your name?"}, {"lvl": 0, "skill": "vocab", "q": "I read a ___ at school.", "o": ["shoe", "book", "rice", "chair"], "a": 1, "w": "Yang bisa dibaca adalah book (buku)."}, {"lvl": 0, "skill": "vocab", "q": "I drink ___ every morning.", "o": ["a bag", "a pen", "water", "a table"], "a": 2, "w": "Yang bisa diminum hanya water (air)."}, {"lvl": 0, "skill": "vocab", "q": "The day after Monday is ___.", "o": ["Sunday", "Friday", "Saturday", "Tuesday"], "a": 3, "w": "Setelah Monday (Senin) adalah Tuesday (Selasa)."}, {"lvl": 0, "skill": "reading", "q": "My name is Tom. I am ten. I have a dog.\n\nHow old is Tom?", "o": ["Nine", "Ten", "Eleven", "Twelve"], "a": 1, "w": "Teks: I am ten."}, {"lvl": 0, "skill": "reading", "q": "Ani is at school. She has a red bag. Her teacher is Mr. Dodi.\n\nWhat color is Ani's bag?", "o": ["Blue", "Green", "Red", "Black"], "a": 2, "w": "Teks: a red bag."}, {"lvl": 0, "skill": "reading", "q": "I get up at six. I eat rice at seven. I go to school at eight.\n\nWhen does the writer eat rice?", "o": ["At eight", "At six", "At nine", "At seven"], "a": 3, "w": "Teks: I eat rice at seven."}, {"lvl": 1, "skill": "grammar", "q": "He ___ football every Sunday.", "o": ["play", "playing", "to play", "plays"], "a": 3, "w": "Present simple untuk he/she/it memakai verba + s."}, {"lvl": 1, "skill": "grammar", "q": "There ___ three books on the table.", "o": ["is", "are", "am", "be"], "a": 1, "w": "Three books jamak, jadi there are."}, {"lvl": 1, "skill": "grammar", "q": "I ___ breakfast at 6 o'clock every day.", "o": ["has", "having", "have", "am have"], "a": 2, "w": "Subjek I memakai have pada present simple."}, {"lvl": 1, "skill": "grammar", "q": "My sister ___ like coffee.", "o": ["doesn't", "don't", "isn't", "aren't"], "a": 0, "w": "Subjek orang ketiga tunggal memakai doesn't + verba dasar."}, {"lvl": 1, "skill": "grammar", "q": "Look! The children ___ in the garden.", "o": ["play", "plays", "are playing", "played"], "a": 2, "w": "Look! menandakan kejadian sedang berlangsung: present continuous."}, {"lvl": 1, "skill": "vocab", "q": "My father's sister is my ___.", "o": ["uncle", "cousin", "aunt", "grandmother"], "a": 2, "w": "Saudara perempuan ayah adalah aunt (bibi)."}, {"lvl": 1, "skill": "vocab", "q": "It is very cold today. Please close the ___.", "o": ["window", "fork", "pencil", "tooth"], "a": 0, "w": "Yang bisa ditutup agar tidak dingin adalah window (jendela)."}, {"lvl": 1, "skill": "vocab", "q": "I'm hungry. I want to eat ___.", "o": ["a bus", "lunch", "a lesson", "a shower"], "a": 1, "w": "Yang bisa dimakan hanya lunch (makan siang)."}, {"lvl": 1, "skill": "reading", "q": "Hi, I'm Lina. I live in Bandung with my parents and my brother. We have a small house near the market.\n\nWho does Lina live with?", "o": ["Her friends", "Her aunt", "Her parents and brother", "Her teacher"], "a": 2, "w": "Teks: with my parents and my brother."}, {"lvl": 1, "skill": "reading", "q": "The shop opens at nine and closes at five. It is closed on Sunday.\n\nWhen can you NOT go to the shop?", "o": ["On Saturday", "On Sunday", "At ten", "At four"], "a": 1, "w": "Teks: It is closed on Sunday."}, {"lvl": 1, "skill": "reading", "q": "Dani likes sports. He plays badminton on Monday and swims on Wednesday. On Saturday he rests.\n\nWhat does Dani do on Wednesday?", "o": ["Swims", "Plays badminton", "Rests", "Studies"], "a": 0, "w": "Teks: swims on Wednesday."}, {"lvl": 2, "skill": "grammar", "q": "We ___ to the beach last weekend.", "o": ["goes", "go", "gone", "went"], "a": 3, "w": "Last weekend menandakan lampau; bentuk lampau go adalah went."}, {"lvl": 2, "skill": "grammar", "q": "She is ___ than her brother.", "o": ["tall", "taller", "more tall", "tallest"], "a": 1, "w": "Komparatif adjektiva pendek: tall menjadi taller."}, {"lvl": 2, "skill": "grammar", "q": "I haven't finished my homework ___.", "o": ["yet", "already", "ago", "last"], "a": 0, "w": "Yet dipakai pada kalimat negatif present perfect."}, {"lvl": 2, "skill": "grammar", "q": "If it rains tomorrow, we ___ at home.", "o": ["stayed", "staying", "will stay", "have stayed"], "a": 2, "w": "Conditional tipe 1: if + present, will + verba dasar."}, {"lvl": 2, "skill": "grammar", "q": "How ___ water do you drink every day?", "o": ["many", "few", "lot", "much"], "a": 3, "w": "Water tak terhitung, jadi how much."}, {"lvl": 2, "skill": "vocab", "q": "The flight was ___ because of the storm, so we waited at the airport for four hours.", "o": ["booked", "missed", "delayed", "packed"], "a": 2, "w": "Delayed berarti tertunda, sesuai dengan menunggu empat jam."}, {"lvl": 2, "skill": "vocab", "q": "I need to ___ some money from the bank to pay for the ticket.", "o": ["save", "withdraw", "lend", "owe"], "a": 1, "w": "Withdraw berarti menarik uang dari bank."}, {"lvl": 2, "skill": "vocab", "q": "My phone battery is almost ___, so I need to charge it.", "o": ["empty", "full", "heavy", "cheap"], "a": 0, "w": "Baterai hampir habis (empty), maka perlu diisi."}, {"lvl": 2, "skill": "reading", "q": "Sara's train leaves at 8:15. She wants to arrive at the station 30 minutes early, so she will leave home at 7:15.\n\nWhat time does Sara want to arrive at the station?", "o": ["7:15", "7:45", "8:15", "8:45"], "a": 1, "w": "30 menit sebelum 8:15 adalah 7:45."}, {"lvl": 2, "skill": "reading", "q": "Dear Mia, thanks for the invitation to your party on Saturday. Sadly, I can't come because I have to visit my grandmother. I hope you have a great time!\n\nWhy can't the writer go to the party?", "o": ["She is ill", "She has no gift", "She has to work", "She must visit her grandmother"], "a": 3, "w": "Teks: I have to visit my grandmother."}, {"lvl": 2, "skill": "reading", "q": "The new cafe on Main Street is cheap and friendly, but it is often crowded at lunchtime. Many students go there after class because the coffee costs only Rp10,000.\n\nWhy do many students go to the cafe?", "o": ["The coffee is cheap", "It is quiet at lunch", "It is far from school", "It has a big garden"], "a": 0, "w": "Teks: the coffee costs only Rp10,000."}, {"lvl": 3, "skill": "grammar", "q": "I ___ in this city for five years now.", "o": ["live", "lived", "am living", "have lived"], "a": 3, "w": "For five years now menuntut present perfect: have lived."}, {"lvl": 3, "skill": "grammar", "q": "If I ___ more money, I would travel around the world.", "o": ["have", "had", "would have", "will have"], "a": 1, "w": "Conditional tipe 2: if + past simple, would + verba dasar."}, {"lvl": 3, "skill": "grammar", "q": "The bridge ___ in 1998.", "o": ["was built", "built", "has been building", "is built"], "a": 0, "w": "Pasif lampau (was built) karena ada tahun 1998."}, {"lvl": 3, "skill": "grammar", "q": "I'm not used to ___ up so early.", "o": ["get", "got", "getting", "gets"], "a": 2, "w": "Be used to diikuti bentuk -ing."}, {"lvl": 3, "skill": "grammar", "q": "You look tired. You ___ to bed earlier last night.", "o": ["must go", "should go", "had to went", "should have gone"], "a": 3, "w": "Should have + V3 untuk penyesalan atau saran atas masa lalu."}, {"lvl": 3, "skill": "vocab", "q": "The company decided to ___ the meeting until next week because the manager was ill.", "o": ["prevent", "persuade", "postpone", "pretend"], "a": 2, "w": "Postpone berarti menunda."}, {"lvl": 3, "skill": "vocab", "q": "She is very ___; she never gets angry even when people are late.", "o": ["ambitious", "patient", "generous", "curious"], "a": 1, "w": "Patient berarti sabar, sesuai konteks tidak marah."}, {"lvl": 3, "skill": "vocab", "q": "The hotel was cheap, but the rooms were ___ and had no windows.", "o": ["spacious", "luxurious", "fashionable", "cramped"], "a": 3, "w": "Cramped berarti sempit; cocok dengan kontras cheap, but."}, {"lvl": 3, "skill": "reading", "q": "Many people think that working from home is easier than going to an office. However, a recent survey found that more than half of home workers feel lonely and find it hard to stop working in the evening.\n\nWhat did the survey find about home workers?", "o": ["They earn more money", "Many feel lonely and work too late", "They prefer going to the office", "They never finish their work"], "a": 1, "w": "Teks: feel lonely dan sulit berhenti bekerja malam hari."}, {"lvl": 3, "skill": "reading", "q": "I had planned to cycle to work, but it started to pour just as I left the house. I decided to take the bus instead, even though it takes twice as long.\n\nWhy did the writer take the bus?", "o": ["The bike was broken", "The bus is faster", "The weather was bad", "He was late"], "a": 2, "w": "Teks: hujan deras (pour) saat berangkat."}, {"lvl": 3, "skill": "reading", "q": "Our town library will close for repairs from 1 to 15 March. During that time, you can return books at the town hall, and the online catalogue will still work.\n\nWhat can people do during the repairs?", "o": ["Return books at the town hall", "Borrow new books at the library", "Use the library's reading room", "Visit a second town library"], "a": 0, "w": "Teks: you can return books at the town hall."}, {"lvl": 4, "skill": "grammar", "q": "By the time we arrived, the film ___.", "o": ["had already started", "already started", "has already started", "was already starting"], "a": 0, "w": "Kejadian lebih dulu dari titik lampau memakai past perfect."}, {"lvl": 4, "skill": "grammar", "q": "Had I known about the traffic, I ___ earlier.", "o": ["would leave", "would have left", "will have left", "had left"], "a": 1, "w": "Conditional tipe 3 inversi: Had I known, ... would have + V3."}, {"lvl": 4, "skill": "grammar", "q": "Not only ___ the exam, but she also got the highest score.", "o": ["she passed", "she did pass", "passed she", "did she pass"], "a": 3, "w": "Not only di awal kalimat menuntut inversi: did she pass."}, {"lvl": 4, "skill": "grammar", "q": "I wish I ___ harder when I was at university.", "o": ["studied", "would study", "had studied", "have studied"], "a": 2, "w": "Wish untuk penyesalan masa lalu memakai past perfect."}, {"lvl": 4, "skill": "grammar", "q": "He is believed ___ the country last year.", "o": ["to leave", "leaving", "to have left", "have left"], "a": 2, "w": "Last year menuntut infinitif perfek: to have left."}, {"lvl": 4, "skill": "vocab", "q": "The government's new policy has been widely ___ by environmental groups, who say it does not go far enough.", "o": ["applauded", "endorsed", "criticised", "hailed"], "a": 2, "w": "Kelompok itu bilang kebijakan kurang jauh, jadi mengkritik (criticised)."}, {"lvl": 4, "skill": "vocab", "q": "Despite the ___ evidence against him, the suspect denied everything.", "o": ["trivial", "overwhelming", "tentative", "reluctant"], "a": 1, "w": "Despite menuntut kontras: bukti sangat kuat (overwhelming) tetapi tetap menyangkal."}, {"lvl": 4, "skill": "vocab", "q": "After the scandal, the CEO was forced to ___ from his position.", "o": ["remove", "resist", "resume", "resign"], "a": 3, "w": "Resign from berarti mengundurkan diri dari jabatan."}, {"lvl": 4, "skill": "reading", "q": "Although electric cars produce no exhaust fumes, critics point out that manufacturing their batteries requires large amounts of energy and rare minerals. Whether they are genuinely greener therefore depends largely on how the electricity that charges them is generated.\n\nWhat is the writer's main point?", "o": ["Electric cars are clearly worse for the environment", "Battery manufacturing has become cheap and clean", "Their environmental value depends on how the electricity is produced", "Rare minerals will soon run out"], "a": 2, "w": "Kalimat akhir: kehijauannya tergantung cara listrik dihasilkan."}, {"lvl": 4, "skill": "reading", "q": "The author's second novel was met with a lukewarm response. Reviewers admired its ambitious structure but felt the characters were too thinly drawn to sustain readers' interest over four hundred pages.\n\nWhat was the main criticism of the novel?", "o": ["The characters lacked depth", "The structure was confusing", "It was too short", "The ending was predictable"], "a": 0, "w": "Teks: characters too thinly drawn, artinya kurang mendalam."}, {"lvl": 4, "skill": "reading", "q": "Local officials had hoped the new toll road would ease congestion in the city centre. Instead, traffic has merely shifted to side streets as drivers try to avoid the fee, leaving residents there worse off than before.\n\nWhat can be inferred about the toll road?", "o": ["It has solved the city's congestion", "Most drivers now prefer it", "It is free for local residents", "It has moved the problem rather than solved it"], "a": 3, "w": "Lalu lintas hanya berpindah ke jalan samping."}, {"lvl": 5, "skill": "grammar", "q": "No sooner ___ the proposal than objections began to pour in.", "o": ["had he announced", "he had announced", "did he announce", "he announced"], "a": 0, "w": "No sooner di awal menuntut inversi dengan past perfect: had he announced ... than."}, {"lvl": 5, "skill": "grammar", "q": "Under no circumstances ___ be disclosed to third parties.", "o": ["the data should", "does the data", "should the data", "the data to"], "a": 2, "w": "Frasa negatif di awal menuntut inversi: should the data be disclosed."}, {"lvl": 5, "skill": "grammar", "q": "It is high time the government ___ action on housing.", "o": ["takes", "took", "has taken", "will take"], "a": 1, "w": "It is high time + past simple (bermakna sudah seharusnya)."}, {"lvl": 5, "skill": "grammar", "q": "The proposal, the details of ___ remain confidential, was approved unanimously.", "o": ["whom", "what", "that", "which"], "a": 3, "w": "Of which untuk benda; of whom untuk orang; that tak bisa mengikuti preposisi."}, {"lvl": 5, "skill": "grammar", "q": "Having been warned several times about the risks, ___.", "o": ["the project went ahead regardless", "the board nevertheless pushed it ahead", "approval was nevertheless given", "the risks were disregarded"], "a": 1, "w": "Subjek frasa participial harus pelaku yang diperingatkan, yaitu the board; opsi lain dangling modifier."}, {"lvl": 5, "skill": "vocab", "q": "The link between the two events is so ___ that no court would accept it as evidence.", "o": ["tenuous", "tenable", "tenacious", "tangible"], "a": 0, "w": "Tenuous berarti lemah dan tipis; tenable (dapat dipertahankan) dan tangible (nyata) bertentangan dengan konteks."}, {"lvl": 5, "skill": "vocab", "q": "The politician's ___ rhetoric, full of grand promises but short on detail, failed to convince the sceptical audience.", "o": ["laconic", "pragmatic", "lucid", "grandiloquent"], "a": 3, "w": "Grandiloquent berarti muluk dan bombastis; laconic berarti singkat, bertentangan dengan grand promises."}, {"lvl": 5, "skill": "vocab", "q": "Her ___ remarks about the competition, delivered with a thin smile, left everyone unsure whether she was complimenting or insulting them.", "o": ["gratuitous", "candid", "equivocal", "exuberant"], "a": 2, "w": "Equivocal berarti bermakna ganda, sehingga membingungkan."}, {"lvl": 5, "skill": "reading", "q": "The proposition that economic growth can be indefinitely decoupled from resource consumption remains more an article of faith than an empirical finding; the handful of countries that appear to have achieved it have, on closer inspection, largely exported their most polluting industries.\n\nWhat does the author imply about countries that seem to have decoupled growth from resource use?", "o": ["They have pioneered cleaner technologies that others can copy", "They consume fewer resources than poorer nations do", "Their apparent success is partly due to moving polluting industries abroad", "Their achievement has been confirmed by empirical studies"], "a": 2, "w": "Penulis menyiratkan keberhasilan itu semu karena industri berpolusi diekspor."}, {"lvl": 5, "skill": "reading", "q": "Critics have long dismissed the novelist as a mere stylist, all surface and no substance. Yet it is precisely the studied lightness of her prose that lends the occasional moment of cruelty in her fiction its devastating force.\n\nWhat is the author's view of the novelist's style?", "o": ["It heightens the impact of her rare cruelty", "It conceals a lack of ideas", "It is unsuited to serious fiction", "It has been ignored by critics"], "a": 0, "w": "Kalimat Yet...: gaya ringan justru membuat kekejaman terasa dahsyat."}, {"lvl": 5, "skill": "reading", "q": "Far from being a neutral instrument, the survey was designed in such a way that respondents were nudged towards the answers its sponsors favoured; hence its headline finding, that 80 per cent of residents welcomed the development, tells us less about local opinion than about the sponsors' ambitions.\n\nWhat is the author's attitude towards the survey's headline finding?", "o": ["Cautiously optimistic", "Mildly amused", "Largely indifferent", "Deeply sceptical"], "a": 3, "w": "Penulis menilai survei bias sehingga temuan tak mencerminkan opini warga."}];
const WRI=[{"id": "w01", "lvl": 0, "p": "Perkenalkan dirimu dalam bahasa Inggris: sebutkan nama, umur, dan kota asalmu.", "min": 8, "must": ["my name is", "years old", "i come from", "hello"], "model": "Hello, my name is Rina. I am sixteen years old. I come from Surabaya.", "tips": "Gunakan pola 'My name is...' dan 'I am ... years old'."}, {"id": "w02", "lvl": 0, "p": "Tulis satu kalimat tentang makanan favoritmu dan alasannya.", "min": 8, "must": ["favorite food", "because", "delicious"], "model": "My favorite food is fried rice because it is cheap and delicious.", "tips": "Gunakan 'because' untuk menyebutkan alasan."}, {"id": "w03", "lvl": 0, "p": "Tulis jam berapa kamu bangun tidur dan apa yang kamu lakukan setelahnya.", "min": 8, "must": ["wake up", "every morning", "at"], "model": "I wake up at five thirty every morning and then I take a bath.", "tips": "Gunakan simple present untuk kebiasaan dan 'at' untuk jam."}, {"id": "w04", "lvl": 1, "p": "Ceritakan rutinitas harianmu dari pagi sampai malam dalam 4-5 kalimat.", "min": 25, "must": ["wake up", "go to school", "have lunch", "in the evening", "go to bed"], "model": "I wake up at half past five every day. After breakfast, I go to school by bike with my best friend. We have lunch at the canteen at noon. I come home at three o'clock and help my mother. In the evening, I do my homework and watch TV. I go to bed at ten.", "tips": "Urutkan kegiatan dengan kata seperti 'after', 'then', dan 'in the evening'."}, {"id": "w05", "lvl": 1, "p": "Deskripsikan anggota keluargamu: siapa saja, umur, dan pekerjaan mereka.", "min": 25, "must": ["my father", "my mother", "works", "years old", "sister"], "model": "There are five people in my family. My father is a teacher and he works at a high school. My mother is a nurse. She is forty years old. I have one older brother and one younger sister. My sister is eight years old and she loves drawing. I love my family very much.", "tips": "Ingat 'he/she works' memakai akhiran -s."}, {"id": "w06", "lvl": 1, "p": "Tulis email singkat kepada temanmu untuk mengundangnya ke pesta ulang tahunmu.", "min": 25, "must": ["dear", "birthday", "party", "please come", "best wishes"], "model": "Dear Andi,\n\nI am having a birthday party at my house this Saturday at four o'clock in the afternoon. We will eat cake, play games, and listen to music. Please come and bring your sister too. I hope to see you there.\n\nBest wishes,\nDina", "tips": "Sebutkan hari, jam, dan tempat acara dengan jelas."}, {"id": "w07", "lvl": 1, "p": "Deskripsikan kamar tidurmu: isi kamar dan letak benda-bendanya.", "min": 25, "must": ["my bedroom", "there is", "next to", "on the wall", "small"], "model": "My bedroom is small but very comfortable. There is a bed next to the window and a wooden desk in the corner. There are many books on the desk. On the wall, there is a big poster of my favorite football team. I like studying and sleeping in my room.", "tips": "Gunakan 'there is' untuk benda tunggal dan 'there are' untuk jamak."}, {"id": "w08", "lvl": 1, "p": "Tulis tentang hobimu: apa hobimu, seberapa sering, dan mengapa kamu menyukainya.", "min": 25, "must": ["my hobby", "i like", "twice a week", "because", "with my friends"], "model": "My hobby is playing badminton. I play it twice a week with my friends in the yard near my house. I like it because it keeps me healthy and happy. Sometimes we have a small match and the loser buys drinks for everyone. It is always fun.", "tips": "Gunakan kata keterangan frekuensi seperti 'often', 'twice a week'."}, {"id": "w09", "lvl": 2, "p": "Ceritakan apa yang kamu lakukan akhir pekan lalu (gunakan bentuk lampau).", "min": 50, "must": ["last weekend", "went", "was", "in the afternoon", "we had"], "model": "Last weekend was really enjoyable. On Saturday morning, I helped my parents clean the house. In the afternoon, I went to the market with my mother and we bought vegetables and fruit. On Sunday, my cousins visited us and we had lunch together. After that, we played cards and watched a funny movie. I was tired in the evening, but I was very happy because I spent time with my family.", "tips": "Perhatikan kata kerja tidak beraturan: go-went, have-had, buy-bought."}, {"id": "w10", "lvl": 2, "p": "Deskripsikan tempat favoritmu di kotamu dan jelaskan mengapa kamu suka ke sana.", "min": 50, "must": ["my favorite place", "is located", "you can", "crowded", "especially"], "model": "My favorite place in my town is the city park. It is located near the town square and it is open every day. You can see many tall trees, a small lake, and a playground for children. It is quite crowded on Sunday morning, especially when people come to exercise. I like going there in the afternoon because the air is fresh and quiet. I usually sit on a bench and read a book there.", "tips": "Gunakan kata sifat untuk membuat gambaran tempat lebih hidup."}, {"id": "w11", "lvl": 2, "p": "Tulis email kepada gurumu untuk memberi tahu bahwa kamu tidak bisa masuk sekolah karena sakit.", "min": 50, "must": ["dear", "i am sorry", "fever", "doctor", "thank you"], "model": "Dear Mr. Budi,\n\nI am sorry to tell you that I cannot come to school today and tomorrow. I have a high fever and a bad cough since last night. My mother took me to the doctor this morning, and he told me to rest at home for two days. I will bring the doctor's letter when I return to school. Could you please tell me about the homework I missed? Thank you for your understanding.\n\nSincerely,\nAndi Pratama", "tips": "Mulai dengan salam sopan dan akhiri dengan ucapan terima kasih."}, {"id": "w12", "lvl": 2, "p": "Tulis rencana liburanmu bulan depan: ke mana, dengan siapa, dan apa yang akan dilakukan.", "min": 50, "must": ["going to", "next month", "with my family", "will", "visit"], "model": "Next month, I am going to visit my grandparents in Yogyakarta with my family. We will travel by train because it is cheaper and more comfortable than driving. I am going to stay there for one week. I will visit Borobudur Temple and walk along Malioboro Street. I will also try local food like gudeg. I hope the weather will be nice, and I am sure we will take a lot of photos.", "tips": "Gunakan 'be going to' untuk rencana dan 'will' untuk prediksi atau harapan."}, {"id": "w13", "lvl": 2, "p": "Tulis pendapatmu: apakah siswa boleh membawa HP ke sekolah? Berikan alasan.", "min": 50, "must": ["in my opinion", "should", "because", "on the other hand", "for example"], "model": "In my opinion, students should be allowed to bring their phones to school, but with clear rules. Phones can help students find information quickly, for example when they study science or look up new words. On the other hand, phones can distract students during lessons because they may play games or chat. Therefore, teachers should ask students to keep their phones in their bags in class. I think this is the best solution because it gives students both freedom and discipline.", "tips": "Gunakan 'in my opinion' dan beri minimal dua alasan."}, {"id": "w14", "lvl": 3, "p": "Tulis email keluhan kepada toko online karena barang yang kamu terima rusak. Jelaskan masalahnya dan apa yang kamu minta.", "min": 80, "must": ["dear sir or madam", "i ordered", "damaged", "refund", "look forward to"], "model": "Dear Sir or Madam,\n\nI am writing to complain about an order that I received yesterday. I ordered a pair of wireless headphones from your website on the fifth of October, and the order number is 12345. Unfortunately, the package arrived late, and when I opened it, I found that the left side of the headphones was damaged. The sound was also very weak and unclear. I have attached some photos to show the problem.\n\nI would like to ask for a refund or a new product as soon as possible. Please let me know what I should do next. I look forward to hearing from you soon.\n\nYours faithfully,\nBayu Saputra", "tips": "Sebutkan nomor pesanan, masalah, dan solusi yang kamu inginkan secara jelas dan sopan."}, {"id": "w15", "lvl": 3, "p": "Ceritakan kenangan masa kecilmu yang paling berkesan. Gunakan bentuk lampau dan beberapa kata penghubung.", "min": 80, "must": ["when i was", "used to", "one day", "so", "finally"], "model": "When I was a child, I lived in a small village near the beach. I used to play with my neighbors after school every day. One day, we decided to build a small boat from old wooden boards. We worked for three hours, and we were very proud of it. However, when we put it in the water, it sank immediately, so we all got wet and laughed loudly. My grandmother was not angry. She gave us hot tea and fried bananas. Finally, we went home happily. I still remember that afternoon because it taught me that failure can be fun too.", "tips": "Gunakan 'used to' untuk kebiasaan di masa lalu dan 'when' untuk menyusun waktu."}, {"id": "w16", "lvl": 3, "p": "Kamu bekerja di bengkel motor. Tulis laporan servis singkat untuk pelanggan: masalah, pekerjaan yang dilakukan, dan biaya.", "min": 80, "must": ["service report", "the problem", "replaced", "checked", "total cost"], "model": "Service Report\n\nCustomer: Mr. Rahmat\nVehicle: Honda Beat, 2019\n\nThe problem: The customer said that the engine was hard to start in the morning and the motorcycle made a strange noise when he rode it. We checked the engine, the battery, and the brake system carefully. We found that the spark plug was dirty and the chain was too loose. We replaced the spark plug, changed the engine oil, cleaned the air filter, and adjusted the chain. We also checked the brake pads, and they are still in good condition.\n\nTotal cost: 185,000 rupiah. The motorcycle is ready to be picked up today.", "tips": "Gunakan bentuk lampau untuk pekerjaan yang sudah selesai dan sebutkan biaya dengan jelas."}, {"id": "w17", "lvl": 3, "p": "Tulis pendapatmu tentang dampak media sosial bagi remaja, baik sisi positif maupun negatifnya.", "min": 80, "must": ["social media", "on one hand", "however", "as a result", "in conclusion"], "model": "Social media has become a big part of teenagers' lives. On one hand, it helps young people stay in touch with friends and learn many new things. For example, they can watch tutorials and join online communities about their interests. However, it also has some disadvantages. Many teenagers spend too many hours on their phones, so they sleep late and do not concentrate in class. As a result, their grades sometimes become worse. They may also compare themselves with others and feel unhappy. In conclusion, social media is useful if teenagers use it wisely and set a time limit every day.", "tips": "Seimbangkan sisi positif dan negatif, lalu tutup dengan kesimpulan."}, {"id": "w18", "lvl": 3, "p": "Tulis email kepada sebuah lembaga kursus bahasa Inggris untuk menanyakan jadwal, biaya, dan cara pendaftaran.", "min": 80, "must": ["i am writing to", "could you please", "schedule", "registration", "i would be grateful"], "model": "Dear Sir or Madam,\n\nI am writing to ask for some information about your English course for beginners. I am a high school student, and I want to improve my speaking and writing skills during the school holiday. Could you please tell me the schedule of the evening classes and the monthly fee? I would also like to know whether there is a free trial class. In addition, could you explain the registration process and the documents that I need to bring? I would be grateful if you could reply by email this week.\n\nThank you very much.\n\nBest regards,\nSiti Aminah", "tips": "Gunakan kalimat sopan seperti 'Could you please...' saat bertanya."}, {"id": "w19", "lvl": 4, "p": "Tulis surat lamaran kerja (cover letter) untuk posisi kasir atau pelayan di sebuah kafe. Jelaskan pengalaman, kemampuan, dan alasan kamu cocok.", "min": 120, "must": ["i am writing to apply", "experience", "responsible", "team", "i would welcome the opportunity"], "model": "Dear Hiring Manager,\n\nI am writing to apply for the position of waiter at your cafe, which I saw advertised on your Instagram page last week. I am a twenty-year-old student at a vocational school in Bandung, and I am looking for a part-time job so that I can develop my skills and support my education.\n\nAlthough I have not worked full-time in a cafe, I have some useful experience. For two years, I helped my aunt in her small food stall every weekend. I served customers, handled cash, and kept the tables clean. Because of this, I am used to working quickly and politely, even when the place is crowded. I am also honest, responsible, and willing to learn new things. At school, I was an active member of the cooking club, where I learned to work in a team.\n\nI am available after four o'clock on weekdays and all day on weekends. I would welcome the opportunity to discuss my application with you in an interview. Thank you for your time and consideration.\n\nYours faithfully,\nDewi Lestari", "tips": "Tunjukkan kemampuan dengan contoh nyata, bukan hanya sifat umum."}, {"id": "w20", "lvl": 4, "p": "Kamu menginap di sebuah hotel dan mengalami beberapa masalah. Tulis email keluhan kepada manajer hotel dan minta solusi.", "min": 120, "must": ["i am writing to complain", "unfortunately", "air conditioner", "compensation", "i expect"], "model": "Dear Mr. Hartono,\n\nI am writing to complain about my recent stay at your hotel from the tenth to the thirteenth of October in room 305. I chose your hotel because of its good reputation, but unfortunately my stay was not as comfortable as I expected.\n\nFirst, the air conditioner did not work properly. The room was very hot at night, and I could not sleep well. I reported the problem to the front desk on the first night, and the staff promised that a technician would come within an hour. However, nobody came until the next afternoon. Second, the bathroom was not clean when I arrived, and the shower was very weak. Finally, breakfast was served late on two mornings, and some food was already cold.\n\nBecause of these problems, I would like to request compensation, such as a partial refund of the room price. I expect to receive your reply within seven days. Thank you for your attention to this matter.\n\nSincerely,\nHadi Wijaya", "tips": "Jelaskan masalah secara berurutan (first, second, finally) dan tutup dengan permintaan yang jelas."}, {"id": "w21", "lvl": 4, "p": "Kamu seorang mekanik bengkel mobil. Tulis laporan servis untuk pelanggan: keluhan, hasil pemeriksaan, perbaikan, suku cadang, biaya, dan saran.", "min": 120, "must": ["service report", "the customer reported", "inspection", "replaced", "we recommend"], "model": "Service Report\n\nCustomer: Mrs. Anita Sari\nVehicle: Toyota Avanza, 2017\nMileage: 86,000 kilometers\n\nThe customer reported that the car vibrated when she drove faster than sixty kilometers per hour. She also said that the brakes made a squeaking sound and that the engine felt weaker than before.\n\nDuring the inspection, we found that the front brake pads were worn out and that the rear left tire was not balanced. The engine oil was also dirty and the air filter was blocked with dust. We replaced the front brake pads, changed the engine oil and the oil filter, and cleaned the air filter. After that, we balanced all four wheels and tested the car on the road for fifteen minutes. The vibration and the noise are now gone.\n\nThe total cost is 1,250,000 rupiah, including parts and labor. We recommend that the customer check the battery and the rear brake pads in about three months. The car is ready to be picked up.\n\nSigned,\nBudi, Senior Mechanic", "tips": "Gunakan bahasa teknis yang singkat dan urutkan: keluhan, temuan, perbaikan, saran."}, {"id": "w22", "lvl": 5, "p": "Tulis esai opini: apakah belajar online lebih baik daripada belajar tatap muka di kelas? Sertakan pendahuluan, minimal dua alasan, satu argumen lawan, dan kesimpulan.", "min": 150, "must": ["in my opinion", "for instance", "furthermore", "nevertheless", "in conclusion", "face-to-face"], "model": "In recent years, online learning has become very popular among students all over the world. Some people believe that it is better than studying in a classroom, while others disagree. In my opinion, online learning is useful, but face-to-face classes are still more effective for most students.\n\nFirst, online learning is flexible. Students can watch recorded lessons at any time and repeat difficult parts as many times as they need. For instance, a student who does not understand a math formula can pause the video and practice slowly. Furthermore, online courses save money and time because students do not have to travel to school every day.\n\nNevertheless, face-to-face learning has important advantages. In a real classroom, students can ask questions directly and receive an immediate answer from the teacher. They also learn how to cooperate, communicate, and solve problems together with their friends. Many students find it difficult to stay focused at home because there are too many distractions, such as games and social media.\n\nIn conclusion, online learning is a helpful tool, but it should not completely replace the classroom. The best solution is a combination of both methods, so students can enjoy flexibility without losing human interaction.", "tips": "Strukturkan esai: pendahuluan, alasan, argumen lawan, kesimpulan, dan gunakan kata penghubung."}, {"id": "w23", "lvl": 5, "p": "Ceritakan pengalaman tak terlupakan dalam hidupmu (misalnya perjalanan, lomba, atau kejadian tak terduga). Jelaskan apa yang terjadi, perasaanmu, dan pelajaran yang kamu ambil.", "min": 150, "must": ["i will never forget", "at first", "suddenly", "by the time", "i realized", "felt"], "model": "I will never forget the day I got lost in a big city during a school trip to Jakarta. At first, everything was exciting. Our class visited the National Museum in the morning, and then the teacher gave us one hour of free time to buy souvenirs. I went to a small shop with two friends, but we separated while we were looking at different things.\n\nSuddenly, I could not find them anywhere. I felt nervous because my phone battery was dead and I did not remember the name of our hotel. I walked around the street for about twenty minutes and tried to stay calm. Then I saw a police officer near the bus stop. I explained my problem to him in simple English and Indonesian, and he kindly helped me call my teacher from his phone.\n\nBy the time the bus came to pick me up, I was tired, hungry, and a little embarrassed. However, my friends were relieved, and my teacher only smiled. That evening, I realized that I should always charge my phone, write down important addresses, and stay with my group. It was a scary experience, but it made me more careful and more confident.", "tips": "Gunakan kata penghubung waktu (at first, suddenly, by the time) dan ceritakan perasaanmu."}, {"id": "w24", "lvl": 5, "p": "Kamu karyawan di sebuah perusahaan. Tulis email kepada atasanmu yang mengusulkan perbaikan proses kerja di kantor. Jelaskan masalah, solusi, manfaat, dan langkah selanjutnya.", "min": 150, "must": ["i would like to propose", "currently", "as a result", "in addition", "would you be available", "benefits"], "model": "Subject: Proposal to Improve Our Customer Complaint Process\n\nDear Ms. Wulandari,\n\nI would like to propose a simple change to the way our team handles customer complaints. I believe this change can save time and make our customers happier.\n\nCurrently, complaints reach us through email, phone calls, and social media, and each staff member records them in a different way. As a result, some complaints are answered late, and a few are even forgotten. Last month, for example, we received about two hundred complaints, and nearly thirty of them were answered after more than three days.\n\nMy suggestion is to use one shared spreadsheet where every complaint is recorded with the date, the customer name, the problem, and the staff member who is responsible. In addition, we could set a rule that every complaint must receive a first reply within twenty-four hours. A short weekly meeting could also help us review difficult cases.\n\nThe main benefits would be faster responses, clearer responsibility, and better reports for management. The cost would be very low because we already have the necessary tools.\n\nWould you be available for a short meeting this week to discuss this idea? I would be happy to prepare a sample sheet before then.\n\nKind regards,\nRizky Ananda", "tips": "Gunakan struktur email profesional: tujuan, masalah, solusi, manfaat, ajakan bertindak."}];

 <div class="row sp" style="margin:8px 0"><span class="sm mu" id="vcnt">${tot} kata</span><button class="btn sec s" onclick="openPage('addwords')">+ Tambah kata</button></div><div class="c" id="vl">${vRows(shown)}</div>${tot>shown.length?`<button class="btn sec w" onclick="V.vp+=60;vList()">Tampilkan lebih banyak (${tot-shown.length})</button>`:''}`;return h}
