function showWord(i){const w=VOC[i];if(!w)return;const r=S.w[w.k],st=wstatus(w.k);
 openSheet(`<div class="row sp"><div><h2 style="margin:0">${esc(w.en)}</h2><div class="sm mu">${esc(sub(w))}</div></div><button class="spk" onclick="speak(${esc(JSON.stringify(w.en))})" aria-label="Putar audio">🔊</button></div><p class="b" style="font-size:17px">${esc(w.m)}</p>${w.ex?`<div class="c sm"><div class="row"><button class="ib" onclick="speak(${esc(JSON.stringify(w.ex))})">🔊</button><div><div>${esc(w.ex)}</div><div class="mu">${esc(w.exm)}</div></div></div></div>`:''}${w.nt?`<p class="sm"><b>Catatan:</b> ${esc(w.nt)}</p>`:''}<div class="row wrap" style="gap:6px"><span class="badge">${LV[w.lv]}</span><span class="badge">${CATS[w.cat][1]}</span>${stBadge(st)}</div>
 <div class="c sm" style="margin-top:10px"><b>Statistik kata ini</b><br>${r&&r.tries?`Percobaan ${r.tries} · benar ${r.ok} · salah ${r.bad} · akurasi ${acc(w.k)}%<br>Pertama dipelajari ${fmtD(r.first)} · terakhir ${fmtD(r.last)} · terakhir benar ${fmtD(r.lastOk)}<br>Ulangan berikutnya: ${fmtD(r.next)}${r.next<=today()?' (jatuh tempo)':''}<br>Riwayat: ${r.h.map(x=>x[1]?'✓':'✗').join(' ')}`:'Belum pernah dijawab. Kata ini berstatus Baru.'}</div>

function pgAddWords(){const m=V.imp||(V.imp={text:'',info:''});return hd('Tambah kosakata')+`<div class="c sm">Satu kata per baris. Format sederhana: <code>kata | arti</code> atau <code>kata: arti</code>. Lengkap: <code>en|id|pos|ipa|pron|contoh|arti contoh|level 0-5|catatan</code> (sama seperti format paket kosakata). Kata yang sudah ada dilewati. Kata baru masuk ke unit "Kosakata saya".</div><div class="c"><label class="f" for="wt">Daftar kata</label><textarea id="wt" rows="8" placeholder="kerupuk | cracker&#10;nasi goreng: fried rice" oninput="V.imp.text=this.value">${esc(m.text)}</textarea><label class="f" for="wf">Atau pilih berkas teks (.txt/.csv/.tsv)</label><input id="wf" type="file" accept=".txt,.csv,.tsv,text/plain,text/csv" onchange="wordFile(this)"><label class="f" for="wu">Atau unduh dari alamat (butuh internet; berisi baris dengan format yang sama)</label><div class="row"><input id="wu" placeholder="https://..." inputmode="url"><button class="btn sec s" onclick="wordUrl()">Unduh</button></div><div class="err" id="fe">${esc(m.info||'')}</div><button class="btn w" onclick="wordSave()">Simpan kata</button></div>`}
function wordFile(el){const f=el.files&&el.files[0];if(!f)return;if(f.size>2e6){V.imp.info='Berkas terlalu besar (maks 2 MB).';render();return}const r=new FileReader();r.onload=()=>{V.imp.text=String(r.result);render()};r.onerror=()=>{V.imp.info='Berkas tidak bisa dibaca.';render()};r.readAsText(f)}

 try{const r=await FETCHF()(u);if(!r.ok)throw new Error('kode '+r.status);const t=await r.text();if(t.length>2e6)throw new Error('terlalu besar');V.imp.text=t;V.imp.info='';render()}catch(e){$('fe').textContent='Gagal mengunduh: '+(e&&e.message||e)}}
function wordSave(){const t=val('wt')||V.imp.text;const p=parseWordLines(t);if(!p.items.length){$('fe').textContent='Tidak ada baris yang bisa dibaca.'+(p.bad.length?' Contoh baris bermasalah: '+p.bad[0]:'');return}const r=addCustom(p.items);V.imp={text:'',info:''};toast(r.n+' kata ditambahkan'+(r.dup?', '+r.dup+' sudah ada':'')+(p.bad.length?', '+p.bad.length+' baris dilewati':'')+'.');render()}

function startRunSpec(spec){if(!spec||!spec.queue||!spec.queue.length){toast('Tidak ada soal yang bisa dibuat untuk pilihan ini.');return}
 V.run=Object.assign({i:0,ii:0,res:[],xp:0,ok:0,n:0,t0:Date.now(),ans:null,fo:null,hintUsed:false,alt:false,tries:0,retried:{},cur:{sel:null,tk:[],played:{}},phase:spec.intro&&spec.intro.length?'intro':'ex'},spec);V.run.queue=spec.queue.slice();
 if(V.stack.length&&V.stack[V.stack.length-1].p==='run'){render()}else openPage('run')}

function startWeak(){const ws=weakWords(15);if(ws.length<1){toast('Belum ada kata lemah. Bagus!');return}const q=ws.map(w=>{const e=mkEx(pick(['typeEn','cloze','id2en','typeId']),w,['typeEn']);e.mode='rev';return e});startRunSpec({kind:'weak',title:'Latihan kata lemah',queue:shuffle(q),retryWrong:true})}
function startDrill(keys){const s=buildDictionaryDrill(keys);startRunSpec(s)}

function startRetention(){const ws=VOC.filter(w=>S.w[w.k]&&S.w[w.k].stg>=4).sort((a,b)=>(S.w[a.k].lastOk||'')<(S.w[b.k].lastOk||'')?-1:1).slice(0,15);if(ws.length<3){toast('Belum cukup kata di tahap hafal sementara. Teruskan ulangan dulu.');return}
 const ks=['typeEn','typeId','clozeT'];startRunSpec({kind:'ret',title:'Tes retensi',queue:ws.map((w,i)=>{const e=mkEx(ks[i%3],w,['typeEn']);e.mode='ret';e.noHint=true;return e}),retryWrong:false})}

const hintKey=ex=>ex.wid||(ex.gid?ex.gid+ex.gi:'x'+ex.kind);
function runHead(){const r=V.run,tot=r.queue.length;return`<div class="hd"><button onclick="quitRun()" aria-label="Keluar">✕</button><div class="f1"><div class="sm mu">${esc(r.title||'Sesi')}</div>${pb(r.phase==='intro'?0:pct(r.i,tot))}</div><span class="badge">⭐ ${r.xp}</span></div>`}
function pgRun(){const r=V.run;if(!r)return hd('Sesi')+empty('Tidak ada sesi aktif.');if(r.phase==='intro')return runIntro();if(r.phase==='done')return runDone();return runEx()}
function runIntro(){const r=V.run,w=r.intro[r.ii],n=r.intro.length;if(!w){r.phase='ex';return runEx()}
 return`<div class="hd"><button onclick="quitRun()" aria-label="Keluar">✕</button><div class="f1"><div class="sm mu">${esc(r.title)} · kenalan dengan kata baru ${r.ii+1}/${n}</div>${pb(pct(r.ii+1,n))}</div></div><div class="xc"><div class="row"><button class="spk" onclick="speak(${esc(JSON.stringify(w.en))})" aria-label="Putar">🔊</button><button class="spk" onclick="speak(${esc(JSON.stringify(w.en))},true)" aria-label="Putar pelan">🐢</button></div><div class="big">${esc(w.en)}</div><div class="pr">${esc(sub(w))}</div><div class="b" style="font-size:19px">${esc(w.m)}</div>${w.ex?`<div class="c sm" style="width:100%;text-align:left"><div class="row"><button class="ib" onclick="speak(${esc(JSON.stringify(w.ex))})">🔊</button><div><div>${esc(w.ex)}</div><div class="mu">${esc(w.exm)}</div></div></div></div>`:''}${w.nt?`<div class="sm mu">${esc(w.nt)}</div>`:''}<div class="sm mu">${LV[w.lv]}</div></div><div class="row"><button class="btn sec f1" onclick="V.run.phase='ex';render()">Lewati pengenalan</button><button class="btn f1" onclick="introNext()">${r.ii+1<n?'Berikutnya':'Mulai latihan'}</button></div>`}
function introNext(){const r=V.run;r.ii++;if(r.ii>=r.intro.length)r.phase='ex';render()}
function opLabel(i){return String.fromCharCode(65+i)+'. '}
function runEx(){const r=V.run,ex=r.queue[r.i];if(!ex){finishRun();return runDone()}const a=r.ans,done=!!a&&r.locked;let h=runHead();
 if(r.passage)h+=`<div class="c" style="white-space:pre-wrap">${esc(r.passage)}</div>`;
 h+=`<div class="xc"><div class="pr">${esc(ex.prompt||'')}</div>${ex.audio?`<div class="row"><button class="spk" onclick="speak(${esc(JSON.stringify(ex.audio))})" aria-label="Putar">🔊</button><button class="spk" onclick="speak(${esc(JSON.stringify(ex.audio))},true)" aria-label="Putar pelan">🐢</button></div>`:''}${ex.big?`<div class="big" style="font-size:${String(ex.big).length>70?'18px':'24px'}">${esc(ex.big)}</div>`:''}${ex.sub?`<div class="sub">${esc(ex.sub)}</div>`:''}</div>`;
 if(ex.type==='mc'){h+=ex.opts.map((o,i)=>{let c='opt';if(a&&r.locked){if(i===ex.ans)c+=' good';else if(i===a.input)c+=' wrong'}else if(r.cur.sel===i)c+=' sel';return`<button class="${c}" ${r.locked?'disabled':''} onclick="runMC(${i})">${opLabel(i)}${esc(o)}</button>`}).join('')}
 else if(ex.type==='type'){h+=`<input id="ti" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Ketik jawabanmu" value="${esc(r.cur.text||'')}" ${r.locked?'disabled':''} onkeydown="if(event.key==='Enter')runCheck()" aria-label="Jawaban">${r.cur.hint&&ex.hintText?`<div class="sm mu" style="margin-top:6px">Petunjuk: <b>${esc(ex.hintText)}</b></div>`:''}`}
 else if(ex.type==='order'){const used=r.cur.tk;h+=`<div class="ans" id="oa">${used.map((ti,j)=>`<button class="tk" ${r.locked?'disabled':''} onclick="runUntok(${j})">${esc(ex.tk[ti])}</button>`).join('')}</div><div class="bank">${ex.tk.map((t,i)=>`<button class="tk ${used.includes(i)?'used':''}" ${used.includes(i)||r.locked?'disabled':''} onclick="runTok(${i})">${esc(t)}</button>`).join('')}</div>`}
 if(a&&r.locked){const ok=r.fo.ok||r.alt;h+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?(r.alt?'✅ Dihitung benar (konfirmasimu)':'✅ Benar!'):(a.near?'❌ Hampir! Cek ejaan.':'❌ Belum tepat.')}</b>${ok&&!r.alt?'':'<br>Jawaban benar: <b>'+esc(ex.show||'')+'</b>'}${ex.reveal?'<br>Kata yang kamu dengar: <b>'+esc(ex.reveal)+'</b>':''}${ex.why?'<div class="sm" style="margin-top:6px">'+ex.why+'</div>':''}${r.tries>0&&a.ok&&!r.fo.ok?'<div class="sm mu">Percobaan ulang benar, tapi percobaan pertama tetap dicatat salah.</div>':''}</div>`;
  const canRetry=!r.fo.ok&&!r.alt&&ex.mode!=='test'&&ex.mode!=='ret'&&ex.type!=='mc'&&r.tries<2&&!a.ok,canAlt=!r.fo.ok&&!r.alt&&ex.fuzzy&&ex.mode!=='test'&&ex.mode!=='ret';
  h+=`<div class="row wrap">${canRetry?'<button class="btn sec f1" onclick="runRetry()">Coba lagi</button>':''}${canAlt?'<button class="btn sec f1" onclick="runAlt()">Jawabanku juga benar</button>':''}<button class="btn f1" onclick="runNext()">Lanjut</button></div>`}
 else if(ex.type==='type'){h+=`<div class="row wrap" style="margin-top:10px"><button class="btn f1" onclick="runCheck()">Periksa</button>${!ex.noHint&&ex.hintText&&!r.cur.hint?'<button class="btn sec" onclick="runHint()">💡 Petunjuk</button>':''}<button class="btn sec" onclick="runSkip()">Tidak tahu</button></div>`}
 else if(ex.type==='order'){h+=`<div class="row wrap" style="margin-top:10px"><button class="btn f1" onclick="runCheck()" ${r.cur.tk.length?'':'disabled'}>Periksa</button><button class="btn sec" onclick="r_=V.run;r_.cur.tk=[];render()">Ulang</button><button class="btn sec" onclick="runSkip()">Tidak tahu</button></div>`}
 else if(ex.type==='mc'&&!r.locked){h+=`<div class="sm mu ctr" style="margin-top:8px">${ex.kind==='pt'?'Pilih satu jawaban.':''}</div>`}
 return h}
function runPlay(){const r=V.run,ex=r&&r.queue[r.i];if(ex&&ex.auto&&!r.cur.played[ex.id]){r.cur.played[ex.id]=1;setTimeout(()=>{if(V.run===r&&r.queue[r.i]===ex)speak(ex.audio)},350)}}
function runMC(i){const r=V.run,ex=r.queue[r.i];if(r.locked)return;r.cur.sel=i;const g=gradeEx(ex,i);r.fo=r.fo||{ok:g.ok};r.ans={ok:g.ok,input:i};r.locked=true;render()}
function runTok(i){const r=V.run;if(r.locked||r.cur.tk.includes(i))return;r.cur.tk.push(i);render()}
function runUntok(j){const r=V.run;if(r.locked)return;r.cur.tk.splice(j,1);render()}
function runHint(){const r=V.run;r.cur.hint=true;r.hintUsed=true;r.cur.text=val('ti');render();const e=$('ti');if(e)e.focus()}
function runCheck(){const r=V.run,ex=r.queue[r.i];if(r.locked)return;let inp;if(ex.type==='type'){inp=val('ti');if(!inp.trim()){toast('Ketik jawabanmu dulu.');return}}else if(ex.type==='order'){inp=r.cur.tk.map(i=>ex.tk[i])}else return;
 const g=gradeEx(ex,inp);if(!r.fo)r.fo={ok:g.ok};r.ans={ok:g.ok,near:g.near,input:inp};r.cur.text=ex.type==='type'?inp:'';r.locked=true;render()}
function runSkip(){const r=V.run;if(r.locked)return;r.fo=r.fo||{ok:false};r.ans={ok:false,input:'',skip:true};r.locked=true;render()}
function runRetry(){const r=V.run;r.tries++;r.locked=false;r.ans=null;r.cur.text='';r.cur.tk=[];render()}
function runAlt(){const r=V.run;r.alt=true;render()}
function runNext(){const r=V.run,ex=r.queue[r.i];if(!r.fo)return;const ok=r.fo.ok||r.alt;
 if(ex.kind==='pt'){/* ditangani pgPT */}

 if(!ok&&r.retryWrong){const key=hintKey(ex);if(!r.retried[key]){r.retried[key]=1;let ne=null;if(ex.wid&&VBY[ex.wid])ne=mkEx(ex.kind&&XK[ex.kind]?ex.kind:'typeEn',VBY[ex.wid],['id2en','typeEn']);else if(ex.gid)ne=gramEx(GBY[ex.gid],ex.gi);if(ne){ne.mode=ex.mode;r.queue.push(ne)}}}

 else if(k==='gtest'){const g=S.g[r.gid]||(S.g[r.gid]={best:0,done:0,test:0,pass:false,last:''});g.test=Math.max(g.test||0,p);g.last=today();if(p>=r.pass){g.pass=true;bonus=40}else bonus=10;lines.push(p>=r.pass?'Tes grammar lulus.':'Belum lulus (butuh ≥'+r.pass+'%). Baca ulang rumus dan latihan dulu.')}

function lastBk(){try{return localStorage.getItem('em_lastbk')||''}catch(e){return''}}
function pgBackup(){const b=lastBk(),n=Object.keys(S.w).length;
 return hd('Backup & pulihkan')+`<div class="c sm">Data hanya di HP ini. Kalau aplikasi dihapus, data hilang tanpa backup. <b>Kunci API tidak ikut.</b></div>
 <div class="c"><b>Ekspor</b><p class="sm mu">${n} kata tercatat · ${S.chats.length} percakapan · ${S.custom.length} kata buatan. Backup terakhir: ${b?fmtD(b):'belum pernah'}.</p><button class="btn w" onclick="doExport()">💾 Simpan backup</button><button class="btn sec w" style="margin-top:8px" onclick="copyBackup()">📋 Salin teks backup</button><div id="bk1" class="sm" style="margin-top:6px"></div></div>
 <div class="c"><b>Pulihkan</b><p class="sm mu">Memulihkan <b>mengganti</b> semua data saat ini.</p><input type="file" id="bf" accept=".json,application/json,text/plain" onchange="bkFile(this)"><label class="f" for="bt">Atau tempel isi backup</label><textarea id="bt" rows="4" placeholder="{&quot;app&quot;:&quot;englishmaster&quot;,...}"></textarea><button class="btn sec w" style="margin-top:8px" onclick="bkPaste()">Periksa &amp; pulihkan</button><div id="bk2" class="sm" style="margin-top:6px"></div></div>
 <div class="c"><b class="bad">Hapus semua data</b><p class="sm mu">Menghapus semua progres dan kata buatan.</p><button class="btn dg w" onclick="cfm('Hapus SEMUA progres di perangkat ini? Ini tidak bisa dibatalkan.','Hapus semua',()=>{wipeAll();closeSheet();go('home');toast('Data direset.')},true)">Hapus semua data</button></div>`}
function bkMsg(id,h){const e=$(id);if(e)e.innerHTML=h}
async function doExport(){const txt=exportJSON(),name='english-master-backup-'+today()+'.json';
 try{const C=window.Capacitor,P=C&&C.Plugins;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,url:r.uri,dialogTitle:'Simpan backup English Master'});try{localStorage.setItem('em_lastbk',today())}catch(e){}bkMsg('bk1','<span class="ok">Pilih tujuan penyimpanan di jendela yang muncul (mis. Drive atau File). Pastikan benar-benar tersimpan.</span>');return}
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);try{localStorage.setItem('em_lastbk',today())}catch(e){}bkMsg('bk1','<span class="ok">Unduhan dimulai ('+esc(name)+'). Jika tidak muncul, pakai "Salin teks backup".</span>')
 }catch(e){bkMsg('bk1','<span class="bad">Gagal menyimpan: '+esc(e&&e.message||e)+'. Coba "Salin teks backup".</span>')}}
async function copyBackup(){const txt=exportJSON();try{await navigator.clipboard.writeText(txt);try{localStorage.setItem('em_lastbk',today())}catch(e){}bkMsg('bk1','<span class="ok">Teks backup disalin ('+Math.round(txt.length/1024)+' KB). Tempel ke catatan atau pesan ke dirimu sendiri.</span>')}catch(e){bkMsg('bk1','<span class="bad">Tidak bisa menyalin otomatis di perangkat ini. Pakai "Simpan backup".</span>')}}
function bkConfirm(text){const r=parseBackup(text);if(r.err){bkMsg('bk2','<span class="bad">'+esc(r.err[0])+'</span>');return}
 const n=Object.keys(r.data.w).length;
 cfm('Backup valid: '+n+' kata tercatat, '+r.data.xp+' XP, '+r.data.chats.length+' percakapan.'+(r.issues&&r.issues.length?' ('+r.issues.length+' bagian rusak dibersihkan.)':'')+' Ganti semua data saat ini dengan backup ini?','Pulihkan',()=>{applyBackup(r.data);closeSheet();go('home');toast('Data dipulihkan.')},true)}
function bkPaste(){const t=val('bt').trim();if(!t){bkMsg('bk2','<span class="bad">Tempel isi backup dulu.</span>');return}bkConfirm(t)}
async function bkFile(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>25e6){bkMsg('bk2','<span class="bad">Berkas terlalu besar.</span>');return}try{bkConfirm(await f.text())}catch(e){bkMsg('bk2','<span class="bad">Berkas tidak bisa dibaca.</span>')}inp.value=''}
/* ---------- BANTUAN ---------- */
function pgHelp(){const ct=VOC.length,cu=S.custom.length;
 return hd('Bantuan')+`<div class="c sm"><b>Isi:</b> ${ct-cu} kata bawaan + ${cu} kata buatanmu · ${GRAM.length} grammar · ${READ.length} bacaan · ${WRI.length} tugas menulis.</div>
 <div class="c sm"><b>Cara belajar:</b> buka tab Belajar dan ketuk langkah yang menyala. Urutannya otomatis: pelajaran, grammar, listening, bacaan, ulangan, lalu tes bagian (≥70%) untuk membuka bagian berikutnya. Ulangi kata di tab Ulangi tiap hari. Sudah bisa? Pakai tes lompat. Latihan bebas ada di bawah jalur.</div>
 <div class="c sm"><b>Status hafal:</b> Baru → Dipelajari → Mulai diingat → Hafal sementara → Dikuasai jangka panjang. Satu jawaban benar belum cukup. Status akhir butuh jawaban diketik setelah jeda panjang, tapi itu bukan jaminan.</div>
 <div class="c sm"><b>Batasan:</b><br>• Arti, IPA, dan pelafalan dibuat dengan bantuan AI, belum dicek manusia.<br>• Tes penempatan hanya perkiraan, bukan CEFR resmi.<br>• Suara memakai Text-to-speech HP.<br>• Speaking dinilai sendiri jika HP tidak punya pengenalan suara.<br>• Writing tanpa AI hanya cek jumlah kata dan frasa kunci.<br>• Soal AI bisa keliru dan tanpa XP.<br>• Data hanya di HP ini, buat backup berkala.</div>`}
/* ---------- ONBOARDING ---------- */
function pgOnb(){const s=S.settings,o=V.onb||(V.onb={name:s.name,av:s.avatar,goal:s.goal});
 return`<div class="onb"><div class="ctr" style="font-size:54px;margin-top:20px">🎓</div><h1 class="ctr">English Master</h1><p class="ctr mu">Belajar bahasa Inggris tanpa batas harian.</p>
 <div class="c"><label class="f" for="on">Siapa namamu?</label><input id="on" value="${esc(o.name)}" maxlength="40" placeholder="Nama panggilan" oninput="V.onb.name=this.value"><label class="f">Pilih avatar</label><div class="chips">${AVATARS.map(a=>`<button class="chip ${a===o.av?'on':''}" onclick="V.onb.av='${a}';V.onb.name=val('on');render()" aria-label="Avatar ${a}">${a}</button>`).join('')}</div><label class="f" for="og">Target harian (jawaban benar)</label><select id="og" onchange="V.onb.goal=+this.value">${opts([10,20,30,50,100].map(x=>[x,x+' / hari']),o.goal)}</select></div>
 <div class="c sm">Jalur belajar disusun otomatis. Kamu tinggal mengikuti urutannya. Sudah bisa bahasa Inggris? Ikuti tes penempatan.</div>
 <button class="btn w" onclick="onbDone(false)">🚀 Mulai dari awal (disarankan untuk pemula)</button><button class="btn sec w" style="margin-top:8px" onclick="onbDone(true)">🧭 Tes penempatan dulu</button></div>`}
function onbDone(pt){const o=V.onb||{},s=S.settings;s.name=String(val('on')||o.name||'').trim().slice(0,40);s.avatar=o.av||s.avatar;s.goal=+val('og')||o.goal||20;s.onboarded=true;persist();V.onb=null;V.tab=pt?'home':'learn';V.stack=[];V.psec=null;render();if(pt)startPT()}
/* ---------- RENDER ---------- */
const TABS={home:vHome,learn:vLearn,vocab:vVocab,review:vReview,stats:vStats,prof:vProf};
const NAV=[['home','🏠','Beranda'],['learn','📚','Belajar'],['vocab','🔤','Kosakata'],['review','🔁','Ulangi'],['stats','📊','Statistik'],['prof','👤','Profil']];
const PAGES={free:()=>pgFree(),unit:a=>pgUnit(a),gram:a=>pgGram(a),run:()=>pgRun(),pt:()=>pgPT(),listen:()=>pgListen(),reading:()=>pgReading(),writing:()=>pgWriting(),write:a=>pgWrite(a),speaking:()=>pgSpeaking(),proof:()=>pgProof(),chats:()=>pgChats(),chat:a=>pgChat(a),addwords:()=>pgAddWords(),backup:()=>pgBackup(),help:()=>pgHelp(),ach:()=>pgAch(),aiset:()=>pgAISet()};
function render(keep){let fid=null,ss=0,se=0;
 if(keep){const a=document.activeElement;if(a&&a.id){fid=a.id;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}}
 const top=V.stack[V.stack.length-1],app=$('app');if(!app||!S)return;let h;
 try{if(!S.settings.onboarded)h=pgOnb();else if(top)h=PAGES[top.p]?PAGES[top.p](top.a):hd('Halaman')+empty('Halaman tidak ditemukan.');else h=(TABS[V.tab]||vHome)()}
 catch(e){try{console.error(e)}catch(x){}h=hd('Terjadi kesalahan',false)+`<div class="c ban"><b>Halaman gagal ditampilkan.</b><p class="sm">${esc(e&&e.message||e)}</p><button class="btn w" onclick="V.stack=[];V.run=null;go('home')">Kembali ke beranda</button></div>`}
 app.innerHTML=h;
 const nav=$('nav'),showNav=S.settings.onboarded&&!top;nav.style.display=showNav?'block':'none';app.style.paddingBottom=showNav?'':'24px';
 if(showNav){const due=counts().due;nav.innerHTML='<div class="in">'+NAV.map(n=>`<button class="${V.tab===n[0]?'on':''}" onclick="go('${n[0]}')" aria-label="${n[2]}" ${V.tab===n[0]?'aria-current="page"':''}><span style="font-size:20px">${n[1]}</span>${n[2]}${n[0]==='review'&&due?` <b class="nb">${due>99?'99+':due}</b>`:''}</button>`).join('')+'</div>'}
 if(V.pscroll&&!top&&V.tab==='learn'){V.pscroll=0;try{const c=document.querySelector('.nd2.cur');if(c)c.scrollIntoView({block:'center'});else window.scrollTo(0,0)}catch(e){}}
 if(fid){const e=$(fid);if(e){try{e.focus();if(ss!=null&&e.setSelectionRange)e.setSelectionRange(ss,se)}catch(x){}}}
 else if(top&&top.p==='run'&&V.run){runPlay();const ti=$('ti');if(ti&&!ti.disabled)try{ti.focus({preventScroll:true})}catch(e){}}}
/* ---------- BOOT ---------- */
function boot(){init();try{ttsInit()}catch(e){}applyTheme();
 try{window.addEventListener('popstate',onPop);window.addEventListener('online',()=>{if(V.tab==='home'&&!V.stack.length&&!V.sheet)render()});window.addEventListener('offline',()=>{if(V.tab==='home'&&!V.stack.length&&!V.sheet)render()})}catch(e){}
 try{history.replaceState({n:0},'')}catch(e){}
 $('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeSheet()});
 render()}

boot();</script></body></html>
