const GRAM=[{"id": "g01", "title": "Subject, Verb, Object (susunan kalimat dasar)", "lvl": 0, "explain": "Kalimat Inggris dasar selalu berurutan: Subject (pelaku) + Verb (kata kerja) + Object (yang dikenai pekerjaan). Contoh: I eat rice (Saya makan nasi). Urutan ini tetap. Jangan membalik kata kerja ke depan atau menaruh objek sebelum kata kerja. Keterangan tempat atau waktu biasanya di akhir kalimat.", "formula": ["S + V + O", "S + V + O + tempat/waktu", "S + V (tanpa objek)"], "examples": [["I eat rice.", "Saya makan nasi."], ["She reads a book.", "Dia membaca sebuah buku."], ["They play football.", "Mereka bermain sepak bola."], ["My mother cooks dinner.", "Ibuku memasak makan malam."], ["We learn English at school.", "Kami belajar bahasa Inggris di sekolah."], ["Birds sing.", "Burung-burung berkicau."]], "mistakes": [["I very like music.", "I like music very much.", "Kata very tidak dipasang sebelum kata kerja; pakai very much di akhir kalimat."], ["She is eat an apple.", "She eats an apple.", "Kata kerja biasa tidak memerlukan is di depannya pada kalimat sederhana."], ["Read a book my sister.", "My sister reads a book.", "Subjek harus di depan, lalu kata kerja, baru objek."], ["She buys at the market a mango.", "She buys a mango at the market.", "Objek langsung ditaruh tepat setelah kata kerja, keterangan tempat di belakang."]], "items": [{"t": "mcq", "q": "Which sentence is correct?", "o": ["I eat rice.", "Eat I rice.", "I rice eat.", "Eat rice I."], "a": 0, "w": "Urutan yang benar adalah Subject + Verb + Object: I (S) eat (V) rice (O)."}, {"t": "mcq", "q": "My mother ___ a cake.", "o": ["makes", "make", "making", "to make"], "a": 0, "w": "Subjek tunggal orang ketiga (my mother) memakai kata kerja dengan -s: makes."}, {"t": "mcq", "q": "They ___ football after school.", "o": ["play", "plays", "playing", "to play"], "a": 0, "w": "They adalah subjek jamak, jadi kata kerja tanpa -s: play."}, {"t": "mcq", "q": "Which word is the verb in the sentence: Anna reads books?", "o": ["Anna", "reads", "books", "Anna reads"], "a": 1, "w": "Reads menyatakan pekerjaan, jadi itu verb. Anna adalah subjek dan books adalah objek."}, {"t": "mcq", "q": "Tom ___ a letter.", "o": ["writes", "sleeps", "arrives", "smiles"], "a": 0, "w": "Kalimat butuh kata kerja yang bisa diikuti objek (a letter). Hanya writes yang cocok."}, {"t": "mcq", "q": "Which word is the object in the sentence: Dogs chase cats?", "o": ["Dogs", "chase", "cats", "Dogs chase"], "a": 2, "w": "Cats adalah yang dikejar, jadi cats adalah objek."}, {"t": "fill", "q": "We ___ (watch) TV every night.", "a": ["watch"], "w": "Subjek we jamak, jadi kata kerja tanpa -s: watch."}, {"t": "fill", "q": "My brother ___ (drink) coffee in the morning.", "a": ["drinks"], "w": "My brother adalah subjek tunggal, jadi kata kerja diberi -s: drinks."}, {"t": "fill", "q": "Ben ___ (open) the shop every morning.", "a": ["opens"], "w": "Ben adalah subjek tunggal, jadi kata kerja diberi -s: opens."}, {"t": "order", "a": "My sister reads a book.", "id": "Kakakku membaca sebuah buku.", "alt": []}, {"t": "order", "a": "The students learn English.", "id": "Para siswa belajar bahasa Inggris.", "alt": []}, {"t": "fix", "q": "I rice eat every day.", "a": ["I eat rice every day."], "w": "Urutan harus Subject + Verb + Object: kata kerja eat sebelum objek rice."}, {"t": "fix", "q": "She a song sings.", "a": ["She sings a song."], "w": "Kata kerja sings harus tepat setelah subjek, lalu objek a song."}, {"t": "fix", "q": "Eat they bread.", "a": ["They eat bread."], "w": "Subjek they harus di depan kata kerja eat."}, {"t": "tr", "q": "Saya makan nasi.", "a": ["I eat rice.", "I eat the rice."], "w": "Urutan: I (subjek) eat (kata kerja) rice (objek)."}, {"t": "tr", "q": "Ibu memasak makan malam.", "a": ["Mother cooks dinner.", "My mother cooks dinner.", "Mom cooks dinner.", "My mom cooks dinner.", "Mum cooks dinner.", "My mum cooks dinner."], "w": "Subjek tunggal, jadi kata kerja diberi -s: cooks. Objeknya dinner."}, {"t": "tr", "q": "Mereka bermain sepak bola.", "a": ["They play football.", "They play soccer."], "w": "They adalah jamak, jadi play tanpa -s. Objek: football atau soccer."}]}, {"id": "g02", "title": "To be: am/is/are (positif, negatif, tanya)", "lvl": 0, "explain": "To be berarti adalah/ada/sedang berada. Pakai am untuk I, is untuk he/she/it dan satu benda, are untuk you/we/they dan benda jamak. Negatif: tambahkan not setelah to be. Tanya: pindahkan to be ke depan subjek. Dalam bahasa Inggris, kata sifat dan nama pekerjaan wajib didahului to be.", "formula": ["S + am/is/are + complement", "S + am/is/are + not + complement", "Am/Is/Are + S + complement?"], "examples": [["I am a student.", "Saya seorang pelajar."], ["She is very smart.", "Dia sangat pintar."], ["They are at home.", "Mereka ada di rumah."], ["He is not a doctor.", "Dia bukan seorang dokter."], ["Are you hungry?", "Apakah kamu lapar?"], ["Is your mother in the kitchen?", "Apakah ibumu ada di dapur?"]], "mistakes": [["She very smart.", "She is very smart.", "Bahasa Inggris wajib memakai to be sebelum kata sifat; jangan dihilangkan seperti di bahasa Indonesia."], ["I am agree with you.", "I agree with you.", "Agree adalah kata kerja, jadi tidak perlu am di depannya."], ["He is go to school every day.", "He goes to school every day.", "To be tidak dipasang bersama kata kerja biasa pada simple present."], ["I not a teacher.", "I am not a teacher.", "Kalimat negatif dengan nama pekerjaan tetap butuh to be: am not."]], "items": [{"t": "mcq", "q": "I ___ a student.", "o": ["am", "is", "are", "be"], "a": 0, "w": "Subjek I selalu memakai am."}, {"t": "mcq", "q": "She ___ my friend.", "o": ["am", "is", "are", "be"], "a": 1, "w": "Subjek she (tunggal) memakai is."}, {"t": "mcq", "q": "They ___ at home now.", "o": ["am", "is", "are", "be"], "a": 2, "w": "Subjek they (jamak) memakai are."}, {"t": "mcq", "q": "___ you tired?", "o": ["Is", "Am", "Are", "Do"], "a": 2, "w": "Pertanyaan dengan you memakai Are di depan: Are you tired?"}, {"t": "mcq", "q": "He ___ not at school today.", "o": ["is", "are", "am", "do"], "a": 0, "w": "Subjek he memakai is, lalu ditambah not untuk negatif."}, {"t": "mcq", "q": "Which sentence is correct?", "o": ["She am happy.", "She is happy.", "She are happy.", "She be happy."], "a": 1, "w": "She memakai is, bukan am, are, atau be."}, {"t": "fill", "q": "It ___ (be) very hot today.", "a": ["is"], "w": "Subjek it memakai is."}, {"t": "fill", "q": "We ___ (be) not late.", "a": ["are"], "w": "Subjek we memakai are, lalu ditambah not."}, {"t": "fill", "q": "___ (be) he your brother?", "a": ["is"], "w": "Pertanyaan dengan he memakai Is di depan subjek."}, {"t": "fill", "q": "I ___ (be) not hungry.", "a": ["am"], "w": "Subjek I memakai am, lalu ditambah not."}, {"t": "order", "a": "She is not a teacher.", "id": "Dia bukan seorang guru.", "alt": ["She isn't a teacher."]}, {"t": "order", "a": "Is your mother at home?", "id": "Apakah ibumu ada di rumah?", "alt": []}, {"t": "fix", "q": "She are my sister.", "a": ["She is my sister."], "w": "Subjek she tunggal, jadi memakai is, bukan are."}, {"t": "fix", "q": "I is a student.", "a": ["I am a student."], "w": "Subjek I selalu memakai am."}, {"t": "fix", "q": "You not are late.", "a": ["You are not late.", "You aren't late.", "You're not late."], "w": "Dalam kalimat negatif, not diletakkan setelah to be: are not."}, {"t": "fix", "q": "My father a doctor.", "a": ["My father is a doctor."], "w": "Kalimat Inggris wajib punya to be sebelum nama pekerjaan: is."}, {"t": "tr", "q": "Saya lapar.", "a": ["I am hungry.", "I'm hungry."], "w": "Kata sifat hungry didahului to be: am."}, {"t": "tr", "q": "Mereka bukan guru.", "a": ["They are not teachers.", "They aren't teachers.", "They're not teachers."], "w": "They memakai are, lalu not. Teachers dalam bentuk jamak."}, {"t": "tr", "q": "Apakah dia di rumah?", "a": ["Is she at home?", "Is he at home?", "Is she home?", "Is he home?"], "w": "Pertanyaan dimulai dengan Is, lalu subjek he atau she."}]}, {"id": "g03", "title": "Pronouns & Possessive Adjectives (I/me/my, he/him/his, dst.)", "lvl": 0, "explain": "Pronoun menggantikan nama orang atau benda. Subject pronoun dipakai sebelum kata kerja: I, you, he, she, it, we, they. Object pronoun dipakai setelah kata kerja atau preposisi: me, you, him, her, it, us, them. Possessive adjective dipakai sebelum kata benda: my, your, his, her, its, our, their.", "formula": ["Subject: I/you/he/she/it/we/they + V", "V atau preposisi + Object: me/you/him/her/it/us/them", "Possessive: my/your/his/her/its/our/their + noun"], "examples": [["I like her.", "Saya menyukainya."], ["He loves his family.", "Dia mencintai keluarganya."], ["They help us every day.", "Mereka membantu kami setiap hari."], ["Our teacher is kind.", "Guru kami baik hati."], ["The dog likes its toy.", "Anjing itu menyukai mainannya."], ["Can you call me tonight?", "Bisakah kamu menelepon saya malam ini?"]], "mistakes": [["Me like coffee.", "I like coffee.", "Sebelum kata kerja dipakai subject pronoun I, bukan me."], ["Dina and me are friends.", "Dina and I are friends.", "Sebagai subjek kalimat, pakai I, bukan me."], ["Budi is my brother. Him is tall.", "Budi is my brother. He is tall.", "Sebagai subjek, pakai he, bukan him."], ["Where is you book?", "Where is your book?", "Sebelum kata benda, pakai possessive adjective your, bukan you."]], "items": [{"t": "mcq", "q": "___ am a teacher.", "o": ["I", "Me", "My", "Mine"], "a": 0, "w": "Sebagai subjek sebelum kata kerja, pakai I."}, {"t": "mcq", "q": "Maria is my friend. I like ___.", "o": ["she", "her", "hers", "his"], "a": 1, "w": "Setelah kata kerja like, pakai object pronoun her."}, {"t": "mcq", "q": "This is Tom. ___ bag is blue.", "o": ["He", "Him", "His", "Her"], "a": 2, "w": "Sebelum kata benda bag, pakai possessive adjective his."}, {"t": "mcq", "q": "My parents live here. I visit ___ every week.", "o": ["they", "them", "their", "theirs"], "a": 1, "w": "Setelah kata kerja visit, pakai object pronoun them."}, {"t": "mcq", "q": "We love ___ school.", "o": ["our", "us", "we", "ours"], "a": 0, "w": "Sebelum kata benda school, pakai possessive adjective our."}, {"t": "mcq", "q": "The dog wags ___ tail.", "o": ["it's", "its", "it", "their"], "a": 1, "w": "Its adalah possessive adjective untuk benda atau hewan. It's berarti it is."}, {"t": "mcq", "q": "Please help ___. I can't do it.", "o": ["I", "my", "me", "mine"], "a": 2, "w": "Setelah kata kerja help, pakai object pronoun me."}, {"t": "fill", "q": "That is Sara. ___ (she) brother is tall.", "a": ["her"], "w": "Sebelum kata benda brother, pakai possessive adjective her."}, {"t": "fill", "q": "I know Mr. Lee. I often see ___ (he) at the market.", "a": ["him"], "w": "Setelah kata kerja see, pakai object pronoun him."}, {"t": "fill", "q": "Look at those boys. ___ (they) are playing football.", "a": ["they"], "w": "Sebagai subjek sebelum kata kerja, pakai they."}, {"t": "fill", "q": "Anna and I are friends. ___ (we) house is near the park.", "a": ["our"], "w": "Sebelum kata benda house, pakai possessive adjective our."}, {"t": "order", "a": "He helps them every day.", "id": "Dia membantu mereka setiap hari.", "alt": []}, {"t": "order", "a": "Our teacher likes us.", "id": "Guru kami menyukai kami.", "alt": []}, {"t": "fix", "q": "Them are my classmates.", "a": ["They are my classmates."], "w": "Sebagai subjek sebelum kata kerja are, pakai they, bukan them."}, {"t": "fix", "q": "I like she very much.", "a": ["I like her very much."], "w": "Setelah kata kerja like, pakai object pronoun her, bukan she."}, {"t": "fix", "q": "Him father is a doctor.", "a": ["His father is a doctor."], "w": "Sebelum kata benda father, pakai possessive adjective his, bukan him."}, {"t": "fix", "q": "The cat drinks it's milk.", "a": ["The cat drinks its milk."], "w": "Its tanpa apostrof menunjukkan kepemilikan. It's adalah singkatan it is."}, {"t": "tr", "q": "Dia mencintai ibunya.", "a": ["She loves her mother.", "He loves his mother."], "w": "Pakai subject pronoun she atau he, dan possessive adjective her atau his."}, {"t": "tr", "q": "Tolong bantu kami.", "a": ["Please help us.", "Help us, please."], "w": "Setelah kata kerja help, pakai object pronoun us."}, {"t": "tr", "q": "Rumah mereka besar.", "a": ["Their house is big.", "Their house is large."], "w": "Sebelum kata benda house, pakai possessive adjective their."}]}, {"id": "g04", "title": "Simple Present (Kebiasaan & Fakta)", "lvl": 1, "explain": "Simple Present dipakai untuk kebiasaan, rutinitas, dan fakta umum. Untuk he, she, it, verba ditambah -s/-es (works, goes, studies). Untuk I, you, we, they, verba tetap dasar. Kalimat negatif dan tanya memakai do/does, lalu verba kembali ke bentuk dasar (tanpa -s).", "formula": ["S + V1 (he/she/it: V-s/es) + O", "S + do/does + not + V1 + O", "Do/Does + S + V1 + O?"], "examples": [["I drink coffee every morning.", "Saya minum kopi setiap pagi."], ["She works in a bank.", "Dia bekerja di sebuah bank."], ["Water boils at 100 degrees Celsius.", "Air mendidih pada suhu 100 derajat Celsius."], ["They do not eat meat.", "Mereka tidak makan daging."], ["Does your brother play football?", "Apakah kakakmu bermain sepak bola?"], ["The train leaves at seven o'clock.", "Kereta berangkat pukul tujuh."]], "mistakes": [["He go to school by bus.", "He goes to school by bus.", "Subjek he/she/it butuh verba dengan -s/-es."], ["She doesn't likes pizza.", "She doesn't like pizza.", "Setelah does/doesn't, verba kembali ke bentuk dasar tanpa -s."], ["Do she live in Bandung?", "Does she live in Bandung?", "Untuk she/he/it, kalimat tanya memakai does, bukan do."], ["My father is work in a hospital.", "My father works in a hospital.", "Jangan pakai is/am/are sebelum verba biasa pada Simple Present."]], "items": [{"t": "mcq", "q": "She ___ to school every day.", "o": ["go", "goes", "going", "gone"], "a": 1, "w": "Subjek she butuh verba dengan -es: goes."}, {"t": "mcq", "q": "They ___ football on Sundays.", "o": ["plays", "playing", "play", "is play"], "a": 2, "w": "Subjek they memakai verba dasar tanpa -s: play."}, {"t": "mcq", "q": "My mother ___ breakfast at six.", "o": ["make", "makes", "making", "is make"], "a": 1, "w": "Subjek my mother (she) butuh verba dengan -s: makes."}, {"t": "mcq", "q": "He ___ like spicy food.", "o": ["don't", "not", "doesn't", "isn't"], "a": 2, "w": "Negatif untuk he/she/it memakai doesn't + verba dasar."}, {"t": "mcq", "q": "___ you speak English at home?", "o": ["Does", "Do", "Are", "Is"], "a": 1, "w": "Subjek you memakai do untuk kalimat tanya Simple Present."}, {"t": "mcq", "q": "The baby ___ a lot in the afternoon.", "o": ["cry", "crys", "cries", "cried"], "a": 2, "w": "Verba berakhir konsonan + y: y menjadi ies, jadi cries."}, {"t": "fill", "q": "My sister ___ (study) English every night.", "a": ["studies"], "w": "Konsonan + y: ganti y dengan ies, jadi studies."}, {"t": "fill", "q": "We ___ (not/watch) TV in the morning.", "a": ["do not watch", "don't watch"], "w": "Subjek we: do not (don't) + verba dasar."}, {"t": "fill", "q": "___ your father drive to work? (Do/Does)", "a": ["does"], "w": "Your father = he, jadi kalimat tanya memakai does."}, {"t": "order", "a": "My brother plays the guitar after school.", "id": "Kakak saya bermain gitar sepulang sekolah."}, {"t": "order", "a": "Does she drink tea in the evening?", "id": "Apakah dia minum teh di malam hari?"}, {"t": "fix", "q": "My uncle live in Surabaya.", "a": ["My uncle lives in Surabaya."], "w": "My uncle = he, jadi verba live perlu -s: lives."}, {"t": "fix", "q": "She doesn't speaks French.", "a": ["She doesn't speak French."], "w": "Setelah doesn't, verba kembali ke bentuk dasar: speak."}, {"t": "fix", "q": "Do he work on Saturdays?", "a": ["Does he work on Saturdays?"], "w": "Subjek he memakai does, bukan do, pada kalimat tanya."}, {"t": "tr", "q": "Dia tinggal di Jakarta.", "a": ["She lives in Jakarta.", "He lives in Jakarta."], "w": "Dia (she/he) butuh verba dengan -s: lives."}, {"t": "tr", "q": "Saya tidak minum kopi.", "a": ["I do not drink coffee.", "I don't drink coffee."], "w": "Negatif dengan I memakai do not/don't + verba dasar."}, {"t": "tr", "q": "Apakah dia bekerja di rumah sakit?", "a": ["Does she work in a hospital?", "Does he work in a hospital?", "Does she work at a hospital?", "Does he work at a hospital?"], "w": "Kalimat tanya untuk he/she memakai does + verba dasar."}, {"t": "tr", "q": "Matahari terbit di timur.", "a": ["The sun rises in the east."], "w": "Fakta umum memakai Simple Present; the sun (it) butuh rises."}]}, {"id": "g05", "title": "Present Continuous (Sedang Berlangsung)", "lvl": 1, "explain": "Present Continuous dipakai untuk kegiatan yang sedang berlangsung sekarang, misalnya saat berbicara. Rumusnya am/is/are + verba-ing. Contoh: I am eating. Kata penanda: now, right now, at the moment. Untuk negatif tambahkan not setelah am/is/are. Untuk tanya, pindahkan am/is/are ke depan kalimat.", "formula": ["S + am/is/are + V-ing + O", "S + am/is/are + not + V-ing + O", "Am/Is/Are + S + V-ing + O?"], "examples": [["I am reading a book now.", "Saya sedang membaca buku sekarang."], ["She is cooking dinner in the kitchen.", "Dia sedang memasak makan malam di dapur."], ["They are playing football at the moment.", "Mereka sedang bermain sepak bola saat ini."], ["He is not sleeping right now.", "Dia tidak sedang tidur sekarang."], ["Are you listening to me?", "Apakah kamu mendengarkan saya?"], ["It is raining outside.", "Di luar sedang hujan."]], "mistakes": [["She is cook now.", "She is cooking now.", "Setelah am/is/are, verba harus memakai -ing."], ["They playing football now.", "They are playing football now.", "Present Continuous wajib memakai am/is/are sebelum verba-ing."], ["He is runing in the park.", "He is running in the park.", "Verba pendek berakhir konsonan-vokal-konsonan: gandakan konsonan akhir sebelum -ing."], ["I am knowing the answer.", "I know the answer.", "Verba keadaan seperti know, like, want tidak dipakai dalam bentuk continuous."]], "items": [{"t": "mcq", "q": "Look! The children ___ in the garden.", "o": ["play", "plays", "are playing", "is playing"], "a": 2, "w": "The children (they) dan kata Look! butuh are + playing."}, {"t": "mcq", "q": "I ___ a letter to my friend right now.", "o": ["write", "am writing", "is writing", "writes"], "a": 1, "w": "Subjek I memakai am + verba-ing: am writing."}, {"t": "mcq", "q": "She ___ TV at the moment.", "o": ["isn't watching", "doesn't watching", "not watching", "aren't watching"], "a": 0, "w": "Negatif: is not (isn't) + verba-ing, sesuai subjek she."}, {"t": "mcq", "q": "___ he waiting for the bus?", "o": ["Do", "Does", "Is", "Are"], "a": 2, "w": "Pertanyaan Present Continuous untuk he memakai Is di depan."}, {"t": "mcq", "q": "Be quiet! The baby ___.", "o": ["sleeps", "is sleeping", "sleeping", "are sleeping"], "a": 1, "w": "Kejadian yang sedang berlangsung: is + sleeping."}, {"t": "mcq", "q": "He is ___ a new shirt now.", "o": ["buy", "buys", "buyed", "buying"], "a": 3, "w": "Setelah is, verba memakai -ing: buying."}, {"t": "fill", "q": "My parents ___ (watch) a movie now.", "a": ["are watching"], "w": "Subjek my parents (they): are + watching."}, {"t": "fill", "q": "Tom ___ (swim) in the pool at the moment.", "a": ["is swimming"], "w": "Verba swim menggandakan m sebelum -ing: swimming."}, {"t": "fill", "q": "We ___ (not/study) right now.", "a": ["are not studying", "aren't studying"], "w": "Subjek we: are not (aren't) + studying."}, {"t": "order", "a": "She is talking on the phone.", "id": "Dia sedang berbicara di telepon."}, {"t": "order", "a": "Are they waiting for us?", "id": "Apakah mereka sedang menunggu kita?"}, {"t": "fix", "q": "I am eat lunch now.", "a": ["I am eating lunch now."], "w": "Setelah am, verba harus memakai -ing: eating."}, {"t": "fix", "q": "They are play cards at the moment.", "a": ["They are playing cards at the moment."], "w": "Setelah are, verba harus memakai -ing: playing."}, {"t": "fix", "q": "The cat is siting on the sofa.", "a": ["The cat is sitting on the sofa."], "w": "Sit berakhir konsonan-vokal-konsonan, gandakan t: sitting."}, {"t": "tr", "q": "Saya sedang belajar sekarang.", "a": ["I am studying now.", "I'm studying now.", "I am studying right now.", "I'm studying right now."], "w": "Sedang berlangsung: am + studying."}, {"t": "tr", "q": "Dia sedang memasak di dapur.", "a": ["She is cooking in the kitchen.", "She's cooking in the kitchen.", "He is cooking in the kitchen.", "He's cooking in the kitchen."], "w": "Dia (she/he): is + cooking."}, {"t": "tr", "q": "Mereka tidak sedang bekerja sekarang.", "a": ["They are not working now.", "They aren't working now.", "They're not working now.", "They are not working right now.", "They aren't working right now.", "They're not working right now."], "w": "Negatif untuk they: are not (aren't) + working."}, {"t": "tr", "q": "Apakah kamu sedang mendengarkan musik?", "a": ["Are you listening to music?"], "w": "Pertanyaan dengan you: Are you + listening. Listen memakai to."}]}, {"id": "g06", "title": "Simple Past (Regular & Irregular)", "lvl": 1, "explain": "Simple Past dipakai untuk kejadian yang sudah selesai di masa lalu, misalnya yesterday, last week, ago. Verba beraturan (regular) ditambah -ed: walked, played. Verba tidak beraturan (irregular) berubah bentuk: go menjadi went, eat menjadi ate. Negatif dan tanya memakai did, lalu verba kembali ke bentuk dasar.", "formula": ["S + V2 + O", "S + did not + V1 + O", "Did + S + V1 + O?"], "examples": [["I walked to school yesterday.", "Saya berjalan kaki ke sekolah kemarin."], ["She went to Bali last month.", "Dia pergi ke Bali bulan lalu."], ["We ate fried rice for dinner.", "Kami makan nasi goreng untuk makan malam."], ["He did not call me last night.", "Dia tidak menelepon saya tadi malam."], ["Did you see the movie?", "Apakah kamu menonton filmnya?"], ["They studied hard two days ago.", "Mereka belajar keras dua hari yang lalu."]], "mistakes": [["She goed to the market.", "She went to the market.", "Go adalah verba tidak beraturan; bentuk lampaunya went, bukan goed."], ["I didn't went to school.", "I didn't go to school.", "Setelah did/didn't, verba kembali ke bentuk dasar."], ["Did he bought a car?", "Did he buy a car?", "Setelah did pada kalimat tanya, pakai verba dasar, bukan bentuk lampau."], ["We play football yesterday.", "We played football yesterday.", "Kata yesterday menandakan masa lampau, jadi verba harus bentuk lampau."]], "items": [{"t": "mcq", "q": "I ___ my grandmother last Sunday.", "o": ["visit", "visits", "visited", "visiting"], "a": 2, "w": "Last Sunday adalah masa lampau; verba regular + ed: visited."}, {"t": "mcq", "q": "She ___ a beautiful dress yesterday.", "o": ["buy", "buyed", "bought", "buys"], "a": 2, "w": "Buy adalah irregular; bentuk lampaunya bought."}, {"t": "mcq", "q": "They ___ to the party last night.", "o": ["didn't go", "didn't went", "don't go", "not went"], "a": 0, "w": "Negatif lampau: didn't + verba dasar (go)."}, {"t": "mcq", "q": "___ you finish your homework?", "o": ["Do", "Does", "Did", "Are"], "a": 2, "w": "Pertanyaan masa lampau memakai Did + verba dasar."}, {"t": "mcq", "q": "He ___ the door and went out.", "o": ["close", "closed", "closeed", "closing"], "a": 1, "w": "Verba berakhir e hanya ditambah d: closed."}, {"t": "mcq", "q": "We ___ a lot of fish at the lake two days ago.", "o": ["catch", "catched", "caught", "catches"], "a": 2, "w": "Catch adalah irregular; bentuk lampaunya caught."}, {"t": "fill", "q": "My father ___ (drive) me to school yesterday.", "a": ["drove"], "w": "Drive adalah irregular; bentuk lampaunya drove."}, {"t": "fill", "q": "They ___ (study) English last night.", "a": ["studied"], "w": "Konsonan + y: ganti y dengan ied, jadi studied."}, {"t": "fill", "q": "I ___ (not/see) him at the mall last week.", "a": ["did not see", "didn't see"], "w": "Negatif lampau: did not (didn't) + verba dasar see."}, {"t": "order", "a": "We watched a movie last night.", "id": "Kami menonton film tadi malam."}, {"t": "order", "a": "Did she call you yesterday?", "id": "Apakah dia meneleponmu kemarin?"}, {"t": "fix", "q": "He eated two eggs this morning.", "a": ["He ate two eggs this morning."], "w": "Eat adalah irregular; bentuk lampaunya ate, bukan eated."}, {"t": "fix", "q": "She didn't called me yesterday.", "a": ["She didn't call me yesterday."], "w": "Setelah didn't, verba kembali ke bentuk dasar: call."}, {"t": "fix", "q": "I visit my uncle last week.", "a": ["I visited my uncle last week."], "w": "Last week menandakan masa lampau, jadi visit menjadi visited."}, {"t": "tr", "q": "Saya pergi ke pasar kemarin.", "a": ["I went to the market yesterday.", "I went to the market yesterday morning."], "w": "Go adalah irregular; bentuk lampaunya went."}, {"t": "tr", "q": "Dia tidak membeli buku itu.", "a": ["She did not buy the book.", "She didn't buy the book.", "He did not buy the book.", "He didn't buy the book.", "She did not buy that book.", "She didn't buy that book.", "He did not buy that book.", "He didn't buy that book."], "w": "Negatif lampau: did not (didn't) + verba dasar buy."}, {"t": "tr", "q": "Apakah kamu menonton pertandingan itu tadi malam?", "a": ["Did you watch the match last night?", "Did you watch the game last night?"], "w": "Pertanyaan lampau: Did + subjek + verba dasar watch."}, {"t": "tr", "q": "Kami tinggal di Bandung dua tahun yang lalu.", "a": ["We lived in Bandung two years ago."], "w": "Two years ago menandakan lampau; live + d menjadi lived."}]}, {"id": "g07", "title": "Future Forms: will, be going to, Present Continuous (Rencana & Prediksi)", "lvl": 2, "explain": "Ada tiga cara membicarakan masa depan. Will: keputusan mendadak, janji, atau prediksi pendapat (I think...). Be going to: rencana yang sudah diputuskan, atau prediksi dari bukti yang terlihat sekarang. Present continuous: rencana tetap yang sudah diatur, biasanya ada waktu atau orang lain yang terlibat (janji temu, tiket).", "formula": ["S + will + V1 (will not = won't)", "S + am/is/are + going to + V1", "S + am/is/are + V-ing + waktu masa depan", "Will + S + V1 ...?"], "examples": [["I'm thirsty. I will get some water.", "Aku haus. Aku akan ambil air."], ["She is going to study medicine after school.", "Dia akan kuliah kedokteran setelah lulus sekolah."], ["We are meeting our teacher at 4 p.m. tomorrow.", "Kami bertemu guru kami jam 4 sore besok."], ["Look at the sky! It is going to rain.", "Lihat langit itu! Sebentar lagi hujan."], ["I think people will travel to Mars in the future.", "Menurutku orang-orang akan bepergian ke Mars di masa depan."], ["I won't tell anyone your secret.", "Aku tidak akan memberi tahu siapa pun rahasiamu."]], "mistakes": [["He will goes to Jakarta tomorrow.", "He will go to Jakarta tomorrow.", "Setelah will selalu pakai kata kerja bentuk dasar (V1), tanpa -s atau -es."], ["She going to buy a new phone.", "She is going to buy a new phone.", "Be going to butuh am/is/are sebelum going."], ["I am meet my friend at 5 o'clock tomorrow.", "I am meeting my friend at 5 o'clock tomorrow.", "Present continuous memakai am/is/are + V-ing, bukan V1."], ["I will to call you tonight.", "I will call you tonight.", "Setelah will tidak dipakai to."]], "items": [{"t": "mcq", "q": "The phone is ringing. I ___ it.", "o": ["will answer", "am going to answer", "answer", "answered"], "a": 0, "w": "Keputusan mendadak saat berbicara memakai will."}, {"t": "mcq", "q": "I promise I ___ you tomorrow.", "o": ["will call", "calls", "called", "am call"], "a": 0, "w": "Janji memakai will + V1."}, {"t": "mcq", "q": "Sarah has bought a ticket. She ___ visit Bali next week.", "o": ["is going to", "are going to", "will to", "going to"], "a": 0, "w": "Rencana yang sudah diputuskan memakai be going to; subjek she butuh is."}, {"t": "mcq", "q": "We ___ dinner with my aunt at 7 tonight. She booked the table.", "o": ["are having", "is having", "have having", "will having"], "a": 0, "w": "Rencana yang sudah diatur memakai present continuous; we butuh are + V-ing."}, {"t": "mcq", "q": "Look at those black clouds! It ___ rain.", "o": ["is going to", "are going to", "rains", "rained"], "a": 0, "w": "Prediksi dari bukti yang terlihat sekarang memakai be going to; it butuh is."}, {"t": "mcq", "q": "I think the exam ___ easy.", "o": ["will be", "is going be", "are be", "will to be"], "a": 0, "w": "Prediksi berupa pendapat (I think) memakai will + V1."}, {"t": "fill", "q": "A: I'm cold. B: I ___ (close) the window.", "a": ["will close", "'ll close"], "w": "Keputusan mendadak memakai will + V1."}, {"t": "fill", "q": "She ___ (study) medicine. She decided last year. (be going to)", "a": ["is going to study"], "w": "Rencana yang sudah diputuskan: is going to + V1."}, {"t": "fill", "q": "We ___ (meet) the manager at 3 p.m. tomorrow. It is in our calendar. (present continuous)", "a": ["are meeting"], "w": "Rencana tetap: are + V-ing."}, {"t": "fill", "q": "Don't worry. I ___ (not tell) anyone your secret.", "a": ["will not tell", "won't tell"], "w": "Janji bentuk negatif: will not atau won't + V1."}, {"t": "order", "a": "We are going to watch a movie tonight.", "id": "Kita akan menonton film malam ini."}, {"t": "order", "a": "Will you help me with this bag?", "id": "Maukah kamu membantuku dengan tas ini?"}, {"t": "fix", "q": "He will goes to Jakarta tomorrow.", "a": ["He will go to Jakarta tomorrow."], "w": "Setelah will pakai V1 tanpa -es."}, {"t": "fix", "q": "She going to buy a new phone.", "a": ["She is going to buy a new phone."], "w": "Be going to butuh is setelah she."}, {"t": "fix", "q": "I am meet my friend at 5 o'clock tomorrow.", "a": ["I am meeting my friend at 5 o'clock tomorrow."], "w": "Present continuous butuh V-ing setelah am."}, {"t": "tr", "q": "Saya akan menelepon kamu nanti.", "a": ["I will call you later.", "I'll call you later.", "I am going to call you later.", "I'm going to call you later.", "I will phone you later.", "I'll phone you later."], "w": "Akan = will atau be going to + V1."}, {"t": "tr", "q": "Mereka akan menikah bulan depan.", "a": ["They are going to get married next month.", "They're going to get married next month.", "They are getting married next month.", "They're getting married next month.", "They will get married next month.", "They'll get married next month."], "w": "Rencana: be going to, present continuous, atau will + get married."}, {"t": "tr", "q": "Kami tidak akan terlambat.", "a": ["We will not be late.", "We won't be late.", "We are not going to be late.", "We aren't going to be late.", "We're not going to be late."], "w": "Negatif: will not (won't) atau am/is/are not going to + be late."}]}, {"id": "g08", "title": "Articles: a / an / the / Tanpa Artikel", "lvl": 1, "explain": "A dan an dipakai untuk benda tunggal yang disebut pertama kali atau tidak spesifik. Pakai an sebelum bunyi vokal (an apple, an hour), a sebelum bunyi konsonan (a book, a university). The dipakai untuk benda yang sudah jelas bagi pembicara dan pendengar. Tanpa artikel untuk benda jamak atau tak terhitung secara umum (I like music).", "formula": ["a + kata benda tunggal berbunyi konsonan", "an + kata benda tunggal berbunyi vokal", "the + kata benda spesifik atau sudah disebut", "tanpa artikel + jamak atau tak terhitung (umum)"], "examples": [["I have a cat and an umbrella.", "Aku punya seekor kucing dan sebuah payung."], ["The cat is on the sofa.", "Kucing itu ada di sofa."], ["She is an engineer.", "Dia seorang insinyur."], ["The sun rises in the east.", "Matahari terbit di timur."], ["I like music and she likes sports.", "Aku suka musik dan dia suka olahraga."], ["He waited for an hour.", "Dia menunggu selama satu jam."]], "mistakes": [["She is teacher.", "She is a teacher.", "Profesi (kata benda tunggal) butuh a atau an."], ["I have an book.", "I have a book.", "Book berbunyi konsonan, jadi pakai a, bukan an."], ["I bought a shirt. A shirt is red.", "I bought a shirt. The shirt is red.", "Benda yang sudah disebut sebelumnya memakai the."], ["The life is beautiful.", "Life is beautiful.", "Hal umum yang tak terhitung tidak memakai the."]], "items": [{"t": "mcq", "q": "I have ___ apple.", "o": ["a", "an", "the", "(tanpa artikel)"], "a": 1, "w": "Apple diawali bunyi vokal, jadi pakai an."}, {"t": "mcq", "q": "She is ___ teacher.", "o": ["a", "an", "the", "(tanpa artikel)"], "a": 0, "w": "Teacher berbunyi konsonan dan profesi tunggal butuh artikel a."}, {"t": "mcq", "q": "___ sun is very hot today.", "o": ["A", "An", "The", "(tanpa artikel)"], "a": 2, "w": "Hanya ada satu matahari, jadi pakai the."}, {"t": "mcq", "q": "I like ___ music.", "o": ["a", "an", "the", "(tanpa artikel)"], "a": 3, "w": "Hal umum yang tak terhitung tidak memakai artikel."}, {"t": "mcq", "q": "He is ___ honest man.", "o": ["a", "an", "the", "(tanpa artikel)"], "a": 1, "w": "Honest dibaca dengan h tak bunyi, awalnya vokal, jadi an."}, {"t": "mcq", "q": "Can you close ___ door, please?", "o": ["a", "an", "the", "(tanpa artikel)"], "a": 2, "w": "Pintu yang dimaksud sudah jelas bagi kedua orang, jadi the."}, {"t": "fill", "q": "I bought a book. ___ book was very interesting.", "a": ["the"], "w": "Buku yang sudah disebut sebelumnya memakai the."}, {"t": "fill", "q": "He is ___ university student.", "a": ["a"], "w": "University diawali bunyi y (konsonan), jadi pakai a."}, {"t": "fill", "q": "Mount Everest is ___ highest mountain in the world.", "a": ["the"], "w": "Superlatif (highest) selalu memakai the."}, {"t": "fill", "q": "There is ___ umbrella under the table.", "a": ["an"], "w": "Umbrella diawali bunyi vokal, jadi an."}, {"t": "order", "a": "I need an umbrella today.", "id": "Saya butuh payung hari ini."}, {"t": "order", "a": "The teacher is in the classroom.", "id": "Gurunya ada di dalam kelas."}, {"t": "fix", "q": "She is teacher.", "a": ["She is a teacher."], "w": "Profesi tunggal butuh artikel a."}, {"t": "fix", "q": "I have an book.", "a": ["I have a book."], "w": "Book berbunyi konsonan, jadi a."}, {"t": "fix", "q": "I bought a shirt. A shirt is red.", "a": ["I bought a shirt. The shirt is red."], "w": "Baju yang sudah disebut memakai the pada penyebutan kedua."}, {"t": "tr", "q": "Dia punya seekor kucing.", "a": ["She has a cat.", "He has a cat.", "She's got a cat.", "He's got a cat."], "w": "Seekor kucing = a cat."}, {"t": "tr", "q": "Matahari terbit dari timur.", "a": ["The sun rises in the east.", "The sun rises from the east.", "The sun comes up in the east."], "w": "Sun dan east memakai the karena unik dan jelas."}, {"t": "tr", "q": "Ibu saya adalah seorang dokter.", "a": ["My mother is a doctor.", "My mom is a doctor.", "My mother is a physician."], "w": "Profesi tunggal butuh a; my sudah cukup untuk mother."}]}, {"id": "g09", "title": "Prepositions of Time & Place: in / on / at (dan lainnya)", "lvl": 1, "explain": "Waktu: at untuk jam dan saat tertentu (at 8, at night), on untuk hari dan tanggal (on Monday), in untuk bulan, tahun, musim, bagian hari (in June, in 2020, in the morning). Tempat: in untuk di dalam atau kota, on untuk di permukaan, at untuk titik tertentu. Lain: under, between, next to, in front of.", "formula": ["at + jam / titik tempat (at 6, at the bus stop)", "on + hari / tanggal / permukaan (on Monday, on the table)", "in + bulan / tahun / ruang tertutup / kota (in May, in a box, in Bandung)", "from ... to / until + waktu"], "examples": [["The class starts at 8 o'clock.", "Kelas dimulai jam 8."], ["We have a meeting on Monday.", "Kami ada rapat hari Senin."], ["My birthday is in June.", "Ulang tahunku bulan Juni."], ["The picture is on the wall.", "Gambar itu ada di dinding."], ["She lives in Bandung.", "Dia tinggal di Bandung."], ["The bus stop is between the bank and the school.", "Halte bus ada di antara bank dan sekolah."]], "mistakes": [["I will see you in Monday.", "I will see you on Monday.", "Hari memakai on, bukan in."], ["She gets up on 6 o'clock.", "She gets up at 6 o'clock.", "Jam memakai at."], ["They live at Surabaya.", "They live in Surabaya.", "Kota memakai in."], ["We go to the beach on December.", "We go to the beach in December.", "Bulan memakai in."]], "items": [{"t": "mcq", "q": "My birthday is ___ June.", "o": ["in", "on", "at", "to"], "a": 0, "w": "Bulan memakai in."}, {"t": "mcq", "q": "The class starts ___ 8 o'clock.", "o": ["in", "on", "at", "by"], "a": 2, "w": "Jam tertentu memakai at."}, {"t": "mcq", "q": "We have a meeting ___ Monday.", "o": ["in", "on", "at", "to"], "a": 1, "w": "Hari memakai on."}, {"t": "mcq", "q": "The picture is ___ the wall.", "o": ["in", "on", "at", "to"], "a": 1, "w": "Menempel di permukaan memakai on."}, {"t": "mcq", "q": "She lives ___ Bandung.", "o": ["in", "on", "at", "to"], "a": 0, "w": "Kota memakai in."}, {"t": "mcq", "q": "The bus stop is ___ the bank and the school.", "o": ["between", "at", "on", "under"], "a": 0, "w": "Di antara dua tempat = between."}, {"t": "mcq", "q": "I usually study ___ the evening.", "o": ["in", "on", "at", "to"], "a": 0, "w": "Bagian hari (morning, afternoon, evening) memakai in."}, {"t": "fill", "q": "I go to bed ___ night.", "a": ["at"], "w": "At night adalah ungkapan tetap."}, {"t": "fill", "q": "She was born ___ 1998.", "a": ["in"], "w": "Tahun memakai in."}, {"t": "fill", "q": "He arrived ___ Sunday morning.", "a": ["on"], "w": "Hari tertentu, termasuk Sunday morning, memakai on."}, {"t": "fill", "q": "I work ___ 9 a.m. to 5 p.m.", "a": ["from"], "w": "Rentang waktu: from ... to."}, {"t": "order", "a": "The lesson starts at nine o'clock.", "id": "Pelajaran dimulai pukul sembilan."}, {"t": "order", "a": "My keys are in my bag.", "id": "Kunci saya ada di dalam tas saya."}, {"t": "fix", "q": "I will see you in Monday.", "a": ["I will see you on Monday."], "w": "Hari memakai on."}, {"t": "fix", "q": "She gets up on 6 o'clock.", "a": ["She gets up at 6 o'clock."], "w": "Jam memakai at."}, {"t": "fix", "q": "They live at Surabaya.", "a": ["They live in Surabaya."], "w": "Kota memakai in."}, {"t": "tr", "q": "Saya bangun pukul enam.", "a": ["I wake up at six.", "I get up at six.", "I wake up at 6.", "I get up at 6.", "I wake up at six o'clock.", "I get up at six o'clock.", "I wake up at 6 o'clock.", "I get up at 6 o'clock."], "w": "Jam memakai at."}, {"t": "tr", "q": "Ulang tahun saya bulan Mei.", "a": ["My birthday is in May.", "My birthday's in May."], "w": "Bulan memakai in."}, {"t": "tr", "q": "Buku itu ada di atas meja.", "a": ["The book is on the table.", "That book is on the table.", "The book is on top of the table."], "w": "Di atas permukaan = on."}]}, {"id": "g10", "title": "Countable & Uncountable Nouns + some/any/much/many/a lot of", "lvl": 2, "explain": "Countable noun bisa dihitung (a book, two books). Uncountable noun tidak bisa dihitung dan tidak punya bentuk jamak (water, rice, money, advice). Pakai many dengan countable jamak, much dengan uncountable. A lot of bisa untuk keduanya. Some dipakai di kalimat positif dan tawaran, any di kalimat negatif dan pertanyaan.", "formula": ["many + countable noun (jamak)", "much + uncountable noun", "some / a lot of + countable jamak atau uncountable", "S + do/does + not + have + any + noun"], "examples": [["There are some apples on the table.", "Ada beberapa apel di atas meja."], ["We don't have any milk.", "Kami tidak punya susu."], ["How much money do you need?", "Berapa banyak uang yang kamu butuhkan?"], ["How many students are in your class?", "Berapa banyak murid di kelasmu?"], ["She has a lot of friends in Bali.", "Dia punya banyak teman di Bali."], ["Would you like some tea?", "Mau teh?"]], "mistakes": [["I need some advices.", "I need some advice.", "Advice adalah uncountable noun, jadi tidak boleh pakai -s."], ["How many money do you have?", "How much money do you have?", "Money uncountable, jadi pakai much, bukan many."], ["I don't have some time.", "I don't have any time.", "Di kalimat negatif pakai any, bukan some."], ["There is much people in the park.", "There are many people in the park.", "People adalah jamak dan countable, jadi pakai many dan are."]], "items": [{"t": "mcq", "q": "There are ___ eggs in the fridge.", "o": ["some", "any", "much", "a"], "a": 0, "w": "Eggs jamak countable di kalimat positif, jadi pakai some."}, {"t": "mcq", "q": "Which word is uncountable?", "o": ["chair", "information", "banana", "student"], "a": 1, "w": "Information tidak bisa dihitung dan tidak punya bentuk jamak."}, {"t": "mcq", "q": "How ___ water do you drink every day?", "o": ["many", "much", "few", "a"], "a": 1, "w": "Water uncountable, jadi pakai much."}, {"t": "mcq", "q": "I don't have ___ homework today.", "o": ["some", "many", "any", "a"], "a": 2, "w": "Kalimat negatif memakai any. Homework juga uncountable, jadi many salah."}, {"t": "mcq", "q": "We don't have ___ chairs for the guests.", "o": ["much", "any", "a little", "an"], "a": 1, "w": "Chairs countable jamak di kalimat negatif, jadi pakai any."}, {"t": "mcq", "q": "Can I have ___ sugar in my coffee, please?", "o": ["some", "many", "a few", "an"], "a": 0, "w": "Dalam permintaan atau tawaran dipakai some. Sugar uncountable."}, {"t": "mcq", "q": "Tom has ___ friends, so he is never alone.", "o": ["much", "a lot of", "a little", "any"], "a": 1, "w": "A lot of cocok di kalimat positif untuk countable jamak. Much tidak dipakai di sini."}, {"t": "mcq", "q": "There isn't ___ traffic this morning.", "o": ["many", "much", "a few", "a lot"], "a": 1, "w": "Traffic uncountable, kalimat negatif, jadi pakai much."}, {"t": "fill", "q": "How ___ people came to the party?", "a": ["many"], "w": "People jamak dan countable, jadi How many."}, {"t": "fill", "q": "Would you like ___ coffee?", "a": ["some"], "w": "Dalam tawaran sopan dipakai some, bukan any."}, {"t": "fill", "q": "How ___ rice do we need for dinner?", "a": ["much"], "w": "Rice uncountable, jadi How much."}, {"t": "fill", "q": "There isn't ___ juice left.", "a": ["any", "much"], "w": "Kalimat negatif dengan uncountable noun bisa memakai any atau much."}, {"t": "order", "a": "There are some books on the desk.", "id": "Ada beberapa buku di atas meja."}, {"t": "order", "a": "How much milk do you want?", "id": "Berapa banyak susu yang kamu mau?"}, {"t": "order", "a": "We do not have any sugar.", "id": "Kami tidak punya gula.", "alt": ["We don't have any sugar."]}, {"t": "fix", "q": "I need some informations about the course.", "a": ["I need some information about the course."], "w": "Information uncountable, tidak ada bentuk informations."}, {"t": "fix", "q": "How many water do you drink?", "a": ["How much water do you drink?"], "w": "Water uncountable, jadi pakai much, bukan many."}, {"t": "fix", "q": "We don't have some bread.", "a": ["We don't have any bread.", "We do not have any bread."], "w": "Kalimat negatif memakai any."}, {"t": "fix", "q": "There are much cars on the road.", "a": ["There are many cars on the road.", "There are a lot of cars on the road."], "w": "Cars countable jamak, jadi pakai many atau a lot of, bukan much."}, {"t": "tr", "q": "Saya punya banyak teman.", "a": ["I have a lot of friends.", "I have many friends.", "I have lots of friends.", "I've got a lot of friends."], "w": "Friends countable jamak, jadi boleh a lot of atau many."}, {"t": "tr", "q": "Tidak ada susu di kulkas.", "a": ["There isn't any milk in the fridge.", "There is no milk in the fridge.", "There's no milk in the fridge.", "There is not any milk in the fridge.", "There isn't any milk in the refrigerator.", "There is no milk in the refrigerator."], "w": "Milk uncountable. Negatif memakai not any atau no."}, {"t": "tr", "q": "Berapa banyak uang yang kamu punya?", "a": ["How much money do you have?", "How much money have you got?"], "w": "Money uncountable, jadi How much."}]}, {"id": "g11", "title": "Comparatives & Superlatives (Perbandingan)", "lvl": 2, "explain": "Comparative membandingkan dua hal, superlative menunjuk yang paling di antara tiga atau lebih. Kata pendek: tall, taller, the tallest. Berakhiran -y: happy, happier, the happiest. Kata panjang: more/most + adjective. Tidak beraturan: good, better, the best; bad, worse, the worst. Setelah comparative pakai than.", "formula": ["S + be + adj-er + than + O", "S + be + more + adj + than + O", "S + be + the + adj-est / the most + adj", "as + adj + as"], "examples": [["My brother is taller than I am.", "Saudara laki-lakiku lebih tinggi daripada aku."], ["This bag is more expensive than that one.", "Tas ini lebih mahal daripada yang itu."], ["Jakarta is the biggest city in Indonesia.", "Jakarta adalah kota terbesar di Indonesia."], ["Today is hotter than yesterday.", "Hari ini lebih panas daripada kemarin."], ["She is the most intelligent student in our class.", "Dia murid paling pintar di kelas kami."], ["Her English is better than mine.", "Bahasa Inggrisnya lebih baik daripada punyaku."]], "mistakes": [["She is more tall than me.", "She is taller than me.", "Adjective pendek memakai -er, bukan more."], ["This is the most cheap shop.", "This is the cheapest shop.", "Adjective pendek memakai the + -est, bukan most."], ["My phone is more good than yours.", "My phone is better than yours.", "Good tidak beraturan: good, better, best."], ["He is taller that his brother.", "He is taller than his brother.", "Setelah comparative dipakai than, bukan that."]], "items": [{"t": "mcq", "q": "My house is ___ than your house.", "o": ["big", "bigger", "biggest", "more big"], "a": 1, "w": "Big berakhiran konsonan tunggal, jadi gandakan g lalu -er: bigger."}, {"t": "mcq", "q": "Mount Everest is ___ mountain in the world.", "o": ["higher", "the highest", "more high", "highest"], "a": 1, "w": "Superlative memakai the + adjective-est."}, {"t": "mcq", "q": "This exam is ___ than the last one.", "o": ["easier", "more easy", "easyer", "the easiest"], "a": 0, "w": "Easy berakhiran -y, ubah y menjadi i lalu -er: easier."}, {"t": "mcq", "q": "Gold is ___ than silver.", "o": ["more expensive", "expensiver", "most expensive", "the more expensive"], "a": 0, "w": "Expensive adalah kata panjang, jadi memakai more di comparative."}, {"t": "mcq", "q": "Today's weather is ___ than yesterday's.", "o": ["good", "better", "best", "more good"], "a": 1, "w": "Bentuk comparative dari good adalah better."}, {"t": "mcq", "q": "Who is ___ student in your class?", "o": ["smarter", "the smartest", "smartest", "more smart"], "a": 1, "w": "Kelas terdiri dari banyak murid, jadi superlative: the smartest."}, {"t": "mcq", "q": "That was the ___ movie I have ever seen.", "o": ["bad", "worse", "worst", "baddest"], "a": 2, "w": "Superlative dari bad adalah the worst."}, {"t": "mcq", "q": "A train is ___ than a bus, but a plane is the fastest.", "o": ["faster", "fast", "more fast", "fastest"], "a": 0, "w": "Membandingkan dua hal dengan than, jadi comparative: faster."}, {"t": "fill", "q": "My sister is ___ (young) than me.", "a": ["younger"], "w": "Adjective pendek ditambah -er untuk comparative."}, {"t": "fill", "q": "Today is ___ (hot) than yesterday.", "a": ["hotter"], "w": "Hot berakhiran konsonan tunggal, gandakan t lalu -er."}, {"t": "fill", "q": "He is the ___ (funny) boy in my class.", "a": ["funniest"], "w": "Funny berakhiran -y, jadi y menjadi i lalu -est."}, {"t": "fill", "q": "This is the ___ (interesting) book in the library.", "a": ["most interesting"], "w": "Interesting adalah kata panjang, jadi superlative memakai the most."}, {"t": "order", "a": "My bag is heavier than your bag.", "id": "Tasku lebih berat daripada tasmu."}, {"t": "order", "a": "She is the tallest girl in the class.", "id": "Dia adalah anak perempuan tertinggi di kelas."}, {"t": "order", "a": "This book is more interesting than that one.", "id": "Buku ini lebih menarik daripada yang itu."}, {"t": "fix", "q": "She is more tall than her sister.", "a": ["She is taller than her sister."], "w": "Tall adjective pendek, jadi taller, bukan more tall."}, {"t": "fix", "q": "This is the most cheap restaurant in town.", "a": ["This is the cheapest restaurant in town."], "w": "Cheap adjective pendek, jadi the cheapest."}, {"t": "fix", "q": "My phone is more good than your phone.", "a": ["My phone is better than your phone.", "My phone is better than yours."], "w": "Comparative dari good adalah better."}, {"t": "fix", "q": "He is taller that his brother.", "a": ["He is taller than his brother."], "w": "Perbandingan memakai than, bukan that."}, {"t": "tr", "q": "Dia lebih tua daripada aku.", "a": ["She is older than me.", "He is older than me.", "She is older than I am.", "He is older than I am."], "w": "Old menjadi older, lalu than."}, {"t": "tr", "q": "Jakarta adalah kota terbesar di Indonesia.", "a": ["Jakarta is the biggest city in Indonesia.", "Jakarta is the largest city in Indonesia."], "w": "Superlative memakai the biggest atau the largest."}, {"t": "tr", "q": "Buku ini lebih mahal daripada buku itu.", "a": ["This book is more expensive than that one.", "This book is more expensive than that book."], "w": "Expensive kata panjang, jadi more expensive than."}, {"t": "tr", "q": "Cuaca hari ini lebih buruk daripada kemarin.", "a": ["The weather is worse today than yesterday.", "The weather today is worse than yesterday.", "Today's weather is worse than yesterday's.", "The weather today is worse than it was yesterday.", "The weather is worse today than it was yesterday."], "w": "Comparative dari bad adalah worse."}]}, {"id": "g12", "title": "Modal Verbs: can, could, must, should, may, might, have to", "lvl": 2, "explain": "Modal verb diikuti V1 tanpa to dan tanpa -s. Can: kemampuan atau izin. Could: kemampuan masa lalu atau permintaan sopan. Must: keharusan kuat. Should: saran. May dan might: kemungkinan (might lebih kecil). Have to: keharusan karena aturan atau keadaan (has to untuk he/she/it). Don't have to: tidak perlu.", "formula": ["S + modal + V1", "S + modal + not + V1", "Modal + S + V1 ...?", "S + have/has to + V1"], "examples": [["She can speak three languages.", "Dia bisa berbicara tiga bahasa."], ["Could you open the window, please?", "Bisakah kamu membuka jendela?"], ["You must wear a helmet when you ride a motorbike.", "Kamu harus memakai helm saat naik motor."], ["You should drink more water.", "Kamu sebaiknya minum lebih banyak air."], ["It may rain this afternoon.", "Mungkin sore ini hujan."], ["I have to get up at five tomorrow.", "Aku harus bangun jam lima besok."]], "mistakes": [["She cans swim very well.", "She can swim very well.", "Modal verb tidak memakai -s untuk he/she/it."], ["You should to see a doctor.", "You should see a doctor.", "Setelah modal verb langsung V1, tanpa to."], ["He must goes to the airport now.", "He must go to the airport now.", "Setelah modal verb pakai V1, bukan V-s."], ["She doesn't has to work today.", "She doesn't have to work today.", "Setelah doesn't, kata kerja kembali ke bentuk dasar: have."]], "items": [{"t": "mcq", "q": "You look tired. You ___ go to bed early.", "o": ["should", "shoulds", "should to", "are should"], "a": 0, "w": "Should untuk saran, dan modal tidak memakai -s, to, atau be."}, {"t": "mcq", "q": "My little brother ___ read yet. He is only three.", "o": ["can", "can't", "must", "should"], "a": 1, "w": "Anak tiga tahun belum bisa membaca, jadi can't."}, {"t": "mcq", "q": "You ___ wear a seat belt. It is the law.", "o": ["must", "might", "can", "may"], "a": 0, "w": "Aturan hukum menyatakan keharusan kuat, jadi must."}, {"t": "mcq", "q": "Look at the dark clouds. It ___ rain soon.", "o": ["might", "can't", "doesn't have to", "don't"], "a": 0, "w": "Might untuk kemungkinan. Awan gelap menandakan mungkin hujan."}, {"t": "mcq", "q": "Students ___ bring their phones to the exam room. It is not allowed.", "o": ["can", "must not", "don't have to", "may"], "a": 1, "w": "Must not berarti dilarang."}, {"t": "mcq", "q": "Tomorrow is Sunday, so I ___ go to school.", "o": ["don't have to", "must not", "can't to", "haven't to"], "a": 0, "w": "Don't have to berarti tidak perlu atau tidak wajib."}, {"t": "mcq", "q": "___ I use your pen, please?", "o": ["May", "Must", "Should", "Have"], "a": 0, "w": "May dipakai untuk meminta izin dengan sopan."}, {"t": "mcq", "q": "When I was five, I ___ ride a bike.", "o": ["can", "could", "must", "should"], "a": 1, "w": "Kemampuan di masa lalu memakai could."}, {"t": "mcq", "q": "She ___ get up early every day because her school starts at six.", "o": ["has to", "have to", "must to", "should to"], "a": 0, "w": "Subjek she memakai has to. Must dan should tidak diikuti to."}, {"t": "fill", "q": "My father ___ (have to) work on Saturdays.", "a": ["has to"], "w": "Subjek orang ketiga tunggal memakai has to."}, {"t": "fill", "q": "You ___ (not/have to) pay. The tea is free.", "a": ["don't have to", "do not have to"], "w": "Tidak perlu membayar, jadi don't have to."}, {"t": "fill", "q": "Yesterday I ___ (not/can) find my keys.", "a": ["could not", "couldn't"], "w": "Masa lalu dari can not adalah could not atau couldn't."}, {"t": "fill", "q": "She ___ (can/not) come to the party tonight. She is sick.", "a": ["cannot", "can't", "can not"], "w": "Bentuk negatif dari can adalah cannot atau can't."}, {"t": "order", "a": "You must not park here.", "id": "Kamu tidak boleh parkir di sini.", "alt": ["You mustn't park here."]}, {"t": "order", "a": "Could you open the window?", "id": "Bisakah kamu membuka jendela?"}, {"t": "order", "a": "I have to finish my homework tonight.", "id": "Aku harus menyelesaikan PR-ku malam ini."}, {"t": "fix", "q": "She cans swim very well.", "a": ["She can swim very well."], "w": "Modal verb tidak memakai -s."}, {"t": "fix", "q": "You should to see a doctor.", "a": ["You should see a doctor."], "w": "Setelah should langsung V1 tanpa to."}, {"t": "fix", "q": "He must goes to the airport now.", "a": ["He must go to the airport now."], "w": "Setelah must pakai V1 tanpa -s."}, {"t": "fix", "q": "She doesn't has to work today.", "a": ["She doesn't have to work today.", "She does not have to work today."], "w": "Setelah doesn't, kata kerja berbentuk dasar: have."}, {"t": "tr", "q": "Saya bisa berenang.", "a": ["I can swim.", "I am able to swim.", "I'm able to swim."], "w": "Kemampuan memakai can + V1."}, {"t": "tr", "q": "Kamu harus minum obat ini.", "a": ["You must take this medicine.", "You have to take this medicine.", "You must drink this medicine.", "You have to drink this medicine."], "w": "Keharusan memakai must atau have to."}, {"t": "tr", "q": "Kamu tidak perlu menunggu.", "a": ["You don't have to wait.", "You do not have to wait.", "You don't need to wait.", "You do not need to wait.", "You needn't wait."], "w": "Tidak perlu: don't have to atau don't need to."}, {"t": "tr", "q": "Mungkin besok hujan.", "a": ["It may rain tomorrow.", "It might rain tomorrow.", "Maybe it will rain tomorrow.", "Perhaps it will rain tomorrow."], "w": "Kemungkinan memakai may atau might + V1."}]}, {"id": "g13", "title": "Present Perfect (have/has + V3)", "lvl": 3, "explain": "Present perfect menghubungkan masa lalu dengan sekarang. Dipakai untuk pengalaman (ever, never), hasil yang masih terasa sekarang (already, yet, just), dan kegiatan yang berlanjut sampai sekarang (for, since). Jangan dipakai dengan waktu lampau yang pasti seperti yesterday atau last week. Gunakan has untuk he/she/it, dan have untuk I/you/we/they.", "formula": ["S + have/has + V3 + O", "S + have/has + not + V3 + O", "Have/Has + S + V3 + O?", "for + lama waktu, since + titik waktu"], "examples": [["I have lost my keys.", "Saya telah kehilangan kunci saya."], ["She has visited Bali three times.", "Dia sudah mengunjungi Bali tiga kali."], ["We have lived here since 2019.", "Kami tinggal di sini sejak 2019."], ["They have not finished the project yet.", "Mereka belum menyelesaikan proyek itu."], ["Have you ever tried durian?", "Pernahkah kamu mencoba durian?"], ["He has worked at this company for five years.", "Dia sudah bekerja di perusahaan ini selama lima tahun."]], "mistakes": [["She have visited Bali twice.", "She has visited Bali twice.", "Subjek she memakai has, bukan have."], ["I have see that movie before.", "I have seen that movie before.", "Setelah have/has harus V3 (seen), bukan bentuk dasar."], ["He has lived here since five years.", "He has lived here for five years.", "Lama waktu memakai for, titik waktu memakai since."], ["We have met him yesterday.", "We met him yesterday.", "Waktu lampau pasti (yesterday) memakai simple past, bukan present perfect."]], "items": [{"t": "mcq", "q": "She ___ her homework already.", "o": ["have finished", "has finished", "has finish", "finishing"], "a": 1, "w": "She memakai has, lalu V3 finished."}, {"t": "mcq", "q": "I have never ___ sushi.", "o": ["eat", "ate", "eaten", "eating"], "a": 2, "w": "Setelah have harus V3 dari eat, yaitu eaten."}, {"t": "mcq", "q": "They ___ in this city since 2020.", "o": ["live", "have lived", "are living", "lived"], "a": 1, "w": "Since menunjukkan kegiatan berlanjut sampai sekarang, jadi present perfect."}, {"t": "mcq", "q": "___ you ever visited Bali?", "o": ["Did", "Have", "Are", "Do"], "a": 1, "w": "Pertanyaan present perfect diawali Have/Has, lalu V3 visited."}, {"t": "mcq", "q": "He has worked here ___ three years.", "o": ["since", "for", "ago", "during"], "a": 1, "w": "For dipakai untuk lama waktu seperti three years."}, {"t": "mcq", "q": "My brother ___ his phone, so he cannot call you.", "o": ["has lost", "have lost", "losing", "lose"], "a": 0, "w": "Hasil sekarang dari kejadian lampau, subjek tunggal memakai has lost."}, {"t": "mcq", "q": "Which sentence is correct?", "o": ["I have seen her yesterday.", "I saw her yesterday.", "I have saw her yesterday.", "I seen her yesterday."], "a": 1, "w": "Yesterday adalah waktu lampau pasti, jadi memakai simple past saw."}, {"t": "fill", "q": "They ___ (be) to Japan twice.", "a": ["have been"], "w": "Pengalaman: have + V3 dari be, yaitu been."}, {"t": "fill", "q": "She ___ (not/eat) breakfast yet.", "a": ["has not eaten", "hasn't eaten"], "w": "Negatif present perfect: has not + V3 eaten."}, {"t": "fill", "q": "We have known each other ___ ten years.", "a": ["for"], "w": "Ten years adalah lama waktu, jadi memakai for."}, {"t": "order", "a": "I have lost my keys.", "id": "Saya telah kehilangan kunci saya.", "alt": ["I have lost my keys"]}, {"t": "order", "a": "She has not finished her work yet.", "id": "Dia belum menyelesaikan pekerjaannya.", "alt": ["She hasn't finished her work yet."]}, {"t": "order", "a": "Have you ever eaten durian?", "id": "Pernahkah kamu makan durian?"}, {"t": "fix", "q": "She have visited Bali twice.", "a": ["She has visited Bali twice."], "w": "Subjek she memakai has."}, {"t": "fix", "q": "I have see that movie before.", "a": ["I have seen that movie before."], "w": "Setelah have harus V3 yaitu seen."}, {"t": "fix", "q": "He has lived here since five years.", "a": ["He has lived here for five years."], "w": "Lama waktu five years memakai for, bukan since."}, {"t": "tr", "q": "Saya sudah makan siang.", "a": ["I have eaten lunch.", "I have had lunch.", "I have already eaten lunch.", "I have already had lunch.", "I've eaten lunch.", "I've had lunch.", "I've already eaten lunch.", "I've already had lunch."], "w": "Hasil sekarang dari kejadian lampau memakai have + V3."}, {"t": "tr", "q": "Dia belum pernah pergi ke Bali.", "a": ["She has never been to Bali.", "He has never been to Bali.", "She hasn't ever been to Bali.", "He hasn't ever been to Bali."], "w": "Pengalaman negatif memakai has never been to."}, {"t": "tr", "q": "Kami tinggal di sini sejak 2019.", "a": ["We have lived here since 2019.", "We've lived here since 2019.", "We have been living here since 2019.", "We've been living here since 2019."], "w": "Since 2019 menunjukkan titik awal sampai sekarang, memakai present perfect."}]}, {"id": "g14", "title": "Passive Voice (present, past, future, modal)", "lvl": 3, "explain": "Passive voice dipakai saat fokus pada objek atau hasil, bukan pelaku. Rumusnya be + V3, dan be mengikuti waktunya: is/are (sekarang), was/were (lampau), will be (akan datang), modal + be (can be, must be). Pelaku boleh ditambahkan dengan by, tetapi sering dihilangkan jika tidak penting atau tidak diketahui.", "formula": ["Present: S + is/am/are + V3", "Past: S + was/were + V3", "Future: S + will be + V3", "Modal: S + modal + be + V3"], "examples": [["English is spoken in many countries.", "Bahasa Inggris dipakai di banyak negara."], ["The window was broken by a ball.", "Jendela itu dipecahkan oleh sebuah bola."], ["The new school will be opened next month.", "Sekolah baru itu akan dibuka bulan depan."], ["Your ticket can be bought online.", "Tiketmu bisa dibeli secara online."], ["These cars are made in Japan.", "Mobil-mobil ini dibuat di Jepang."], ["My bike was stolen last week.", "Sepeda saya dicuri minggu lalu."]], "mistakes": [["English is speak in many countries.", "English is spoken in many countries.", "Passive memakai V3 (spoken), bukan bentuk dasar."], ["The thief was catch by the police.", "The thief was caught by the police.", "Setelah was harus V3 dari catch, yaitu caught."], ["The food will cooked by my father.", "The food will be cooked by my father.", "Future passive butuh will be + V3, jangan lupa be."], ["The book written by a famous author in 1990.", "The book was written by a famous author in 1990.", "Passive tidak boleh kehilangan be (was) sebelum V3."]], "items": [{"t": "mcq", "q": "English ___ in many countries.", "o": ["speaks", "is spoken", "is speaking", "spoke"], "a": 1, "w": "English menerima aksi, jadi passive present: is + V3."}, {"t": "mcq", "q": "The window ___ by the boy yesterday.", "o": ["broke", "was broken", "is broken", "has break"], "a": 1, "w": "Yesterday berarti lampau, passive past: was + V3 broken."}, {"t": "mcq", "q": "A new bridge ___ next year.", "o": ["will build", "will be built", "will built", "is building"], "a": 1, "w": "Passive future: will be + V3."}, {"t": "mcq", "q": "The rules must ___ by everyone.", "o": ["follow", "followed", "be followed", "been followed"], "a": 2, "w": "Passive dengan modal: modal + be + V3."}, {"t": "mcq", "q": "These cars ___ in Japan.", "o": ["is made", "are made", "make", "was make"], "a": 1, "w": "Cars jamak dan kebiasaan sekarang, jadi are made."}, {"t": "mcq", "q": "My bike ___ last week.", "o": ["stole", "was stolen", "is stolen", "were stolen"], "a": 1, "w": "Last week berarti lampau, bike tunggal, jadi was stolen."}, {"t": "fill", "q": "The cake ___ (make) by my mother every Sunday.", "a": ["is made"], "w": "Kebiasaan sekarang, subjek tunggal: is + V3 made."}, {"t": "fill", "q": "The letters ___ (send) yesterday.", "a": ["were sent"], "w": "Letters jamak dan lampau: were + V3 sent."}, {"t": "fill", "q": "Your ticket can ___ (buy) online.", "a": ["be bought"], "w": "Modal can + be + V3 bought."}, {"t": "fill", "q": "The new school ___ (open) next month.", "a": ["will be opened", "is going to be opened"], "w": "Masa depan passive: will be + V3 opened."}, {"t": "order", "a": "The window was broken by a ball.", "id": "Jendela itu dipecahkan oleh sebuah bola."}, {"t": "order", "a": "This room is cleaned every day.", "id": "Ruangan ini dibersihkan setiap hari."}, {"t": "order", "a": "The meeting will be held on Monday.", "id": "Rapat itu akan diadakan pada hari Senin."}, {"t": "fix", "q": "The thief was catch by the police.", "a": ["The thief was caught by the police."], "w": "Setelah was harus V3 caught."}, {"t": "fix", "q": "English is speak in many countries.", "a": ["English is spoken in many countries."], "w": "Passive memakai V3 spoken."}, {"t": "fix", "q": "The food will cooked by my father.", "a": ["The food will be cooked by my father."], "w": "Future passive: will be + V3, be tidak boleh hilang."}, {"t": "fix", "q": "The book written by a famous author in 1990.", "a": ["The book was written by a famous author in 1990."], "w": "Kalimat butuh was sebelum written."}, {"t": "tr", "q": "Rumah ini dibangun pada tahun 1990.", "a": ["This house was built in 1990.", "The house was built in 1990."], "w": "Lampau passive: was + V3 built."}, {"t": "tr", "q": "Nasi dimakan setiap hari di Indonesia.", "a": ["Rice is eaten every day in Indonesia.", "Rice is eaten daily in Indonesia.", "Rice is eaten every day in Indonesia"], "w": "Kebiasaan sekarang passive: is + V3 eaten."}, {"t": "tr", "q": "Pekerjaan itu akan diselesaikan besok.", "a": ["The work will be finished tomorrow.", "The job will be finished tomorrow.", "The work will be completed tomorrow.", "The job will be completed tomorrow.", "That work will be finished tomorrow.", "That job will be finished tomorrow."], "w": "Masa depan passive: will be + V3."}]}, {"id": "g15", "title": "Conditional Sentences (zero, first, second, third)", "lvl": 3, "explain": "Kalimat pengandaian punya empat tipe. Zero: fakta umum (If + present, present). First: kemungkinan nyata di masa depan (If + present, will + V1). Second: pengandaian tidak nyata sekarang (If + past, would + V1; pakai were untuk semua subjek). Third: penyesalan masa lalu (If + had + V3, would have + V3).", "formula": ["Zero: If + S + V1, S + V1", "First: If + S + V1, S + will + V1", "Second: If + S + V2/were, S + would + V1", "Third: If + S + had + V3, S + would have + V3"], "examples": [["If you heat ice, it melts.", "Jika kamu memanaskan es, es itu meleleh."], ["If it rains tomorrow, we will stay home.", "Jika besok hujan, kami akan tinggal di rumah."], ["If I were rich, I would buy a big house.", "Seandainya saya kaya, saya akan membeli rumah besar."], ["If she had studied harder, she would have passed the exam.", "Seandainya dia belajar lebih giat, dia pasti lulus ujian."], ["If I were you, I would take that job.", "Kalau saya jadi kamu, saya akan mengambil pekerjaan itu."], ["If he hurries, he will not miss the bus.", "Jika dia bergegas, dia tidak akan ketinggalan bus."]], "mistakes": [["If it will rain tomorrow, we will stay home.", "If it rains tomorrow, we will stay home.", "Setelah If tidak dipakai will, gunakan present simple."], ["If I would have money, I would buy a car.", "If I had money, I would buy a car.", "Klausa If tipe kedua memakai past simple, bukan would."], ["If he had known, he would told you.", "If he had known, he would have told you.", "Tipe ketiga: would have + V3, kata have tidak boleh hilang."], ["If I am you, I would study more.", "If I were you, I would study more.", "Pengandaian tidak nyata memakai were, bukan am."]], "items": [{"t": "mcq", "q": "If you heat ice, it ___.", "o": ["melt", "melts", "will melted", "melting"], "a": 1, "w": "Fakta umum (zero conditional): present simple, it memakai melts."}, {"t": "mcq", "q": "If it rains tomorrow, we ___ at home.", "o": ["stay", "stayed", "will stay", "would stay"], "a": 2, "w": "Kemungkinan nyata di masa depan: If + present, will + V1."}, {"t": "mcq", "q": "If I ___ rich, I would buy a big house.", "o": ["am", "were", "will be", "have been"], "a": 1, "w": "Pengandaian tidak nyata sekarang memakai were."}, {"t": "mcq", "q": "If she had studied harder, she ___ the exam.", "o": ["would pass", "will pass", "would have passed", "passed"], "a": 2, "w": "Tipe ketiga: had + V3 di If, would have + V3 di hasil."}, {"t": "mcq", "q": "If I were you, I ___ that job.", "o": ["take", "will take", "would take", "would have taken"], "a": 2, "w": "Tipe kedua: If + were, would + V1."}, {"t": "mcq", "q": "If he does not hurry, he ___ the bus.", "o": ["misses", "will miss", "would miss", "missed"], "a": 1, "w": "Tipe pertama: kemungkinan nyata, hasil memakai will + V1."}, {"t": "mcq", "q": "If we had left earlier, we ___ late.", "o": ["wouldn't have been", "won't have been", "weren't", "didn't be"], "a": 0, "w": "Tipe ketiga memakai would not have + V3."}, {"t": "fill", "q": "If you ___ (study) hard, you will pass the test.", "a": ["study"], "w": "Tipe pertama: If + present simple, subjek you memakai study."}, {"t": "fill", "q": "If I had more time, I ___ (travel) more.", "a": ["would travel", "'d travel"], "w": "Tipe kedua: would + V1 pada klausa hasil."}, {"t": "fill", "q": "If they had called me, I ___ (help) them.", "a": ["would have helped"], "w": "Tipe ketiga: would have + V3 helped."}, {"t": "order", "a": "We will stay home if it rains.", "id": "Kami akan tinggal di rumah jika hujan.", "alt": ["We will stay at home if it rains."]}, {"t": "order", "a": "I would travel the world if I were rich.", "id": "Saya akan berkeliling dunia seandainya saya kaya."}, {"t": "order", "a": "She would have come if she had known.", "id": "Dia pasti datang seandainya dia tahu."}, {"t": "fix", "q": "If it will rain tomorrow, we will stay home.", "a": ["If it rains tomorrow, we will stay home.", "If it rains tomorrow we will stay home."], "w": "Setelah If tidak memakai will, pakai present simple rains."}, {"t": "fix", "q": "If I would have money, I would buy a car.", "a": ["If I had money, I would buy a car.", "If I had money I would buy a car."], "w": "Klausa If tipe kedua memakai past simple had."}, {"t": "fix", "q": "If he had known, he would told you.", "a": ["If he had known, he would have told you.", "If he had known he would have told you."], "w": "Tipe ketiga: would have + V3, jadi would have told."}, {"t": "tr", "q": "Jika kamu memanaskan air, air itu mendidih.", "a": ["If you heat water, it boils.", "If you heat water it boils."], "w": "Fakta umum: zero conditional, present simple di kedua klausa."}, {"t": "tr", "q": "Jika besok hujan, kami akan tinggal di rumah.", "a": ["If it rains tomorrow, we will stay home.", "If it rains tomorrow we will stay home.", "If it rains tomorrow, we will stay at home.", "If it rains tomorrow we will stay at home.", "If it rains tomorrow, we'll stay home.", "If it rains tomorrow we'll stay home.", "If it rains tomorrow, we'll stay at home.", "If it rains tomorrow we'll stay at home."], "w": "Tipe pertama: If + present simple, will + V1."}, {"t": "tr", "q": "Seandainya saya kaya, saya akan membeli rumah besar.", "a": ["If I were rich, I would buy a big house.", "If I were rich I would buy a big house.", "If I were rich, I'd buy a big house.", "If I were rich I'd buy a big house.", "If I were rich, I would buy a large house.", "If I were rich I would buy a large house."], "w": "Tipe kedua: If + were, would + V1."}]}, {"id": "g16", "title": "Relative Clauses: who, which, that, whose, where", "lvl": 3, "explain": "Relative clause menambah informasi tentang kata benda. Pakai who untuk orang, which untuk benda/hewan, that untuk orang atau benda (tidak untuk klausa tambahan dengan koma), whose untuk kepemilikan, where untuk tempat. Who, which, that boleh dihilangkan jika menjadi objek. Klausa non-defining diberi koma dan tidak memakai that.", "formula": ["Noun (orang) + who/that + V", "Noun (benda) + which/that + S + V", "Noun + whose + noun + V", "Noun (tempat) + where + S + V", "Noun, who/which ..., + V (non-defining)"], "examples": [["The girl who lives next door is a nurse.", "Gadis yang tinggal di sebelah adalah seorang perawat."], ["This is the book that I bought yesterday.", "Ini adalah buku yang saya beli kemarin."], ["I have a friend whose mother is a famous singer.", "Saya punya teman yang ibunya seorang penyanyi terkenal."], ["That is the restaurant where we had dinner.", "Itu restoran tempat kami makan malam."], ["My brother, who lives in Bali, is a diver.", "Kakak saya, yang tinggal di Bali, adalah seorang penyelam."], ["The movie which we watched was boring.", "Film yang kami tonton membosankan."]], "mistakes": [["The woman which works here is my aunt.", "The woman who works here is my aunt.", "Untuk orang pakai who atau that, bukan which."], ["I know a boy who his father is a pilot.", "I know a boy whose father is a pilot.", "Untuk kepemilikan pakai whose, dan tidak perlu his lagi setelahnya."], ["My laptop, that I bought last year, is broken.", "My laptop, which I bought last year, is broken.", "Klausa dengan koma (non-defining) tidak boleh memakai that."], ["The book which I read it was great.", "The book which I read was great.", "Which sudah menjadi objek, jadi jangan ulang dengan it."]], "items": [{"t": "mcq", "q": "The girl ___ lives next door is a nurse.", "o": ["who", "which", "whose", "where"], "a": 0, "w": "Girl adalah orang dan menjadi subjek klausa, jadi pakai who."}, {"t": "mcq", "q": "This is the book ___ I bought yesterday.", "o": ["who", "which", "whose", "where"], "a": 1, "w": "Book adalah benda, jadi pakai which."}, {"t": "mcq", "q": "That is the man ___ car was stolen.", "o": ["who", "which", "whose", "that"], "a": 2, "w": "Kepemilikan (mobil milik pria itu) memakai whose."}, {"t": "mcq", "q": "I remember the café ___ we first met.", "o": ["who", "which", "where", "whose"], "a": 2, "w": "Café adalah tempat, jadi pakai where."}, {"t": "mcq", "q": "Everything ___ he said was true.", "o": ["that", "who", "whose", "where"], "a": 0, "w": "Setelah everything, kata penghubung yang tepat adalah that."}, {"t": "mcq", "q": "My brother, ___ lives in Bali, is a diver.", "o": ["that", "who", "which", "whose"], "a": 1, "w": "Klausa dengan koma tidak memakai that; untuk orang pakai who."}, {"t": "mcq", "q": "The company ___ products are sold worldwide is very large.", "o": ["who", "which", "whose", "where"], "a": 2, "w": "Products milik company, jadi pakai whose."}, {"t": "fill", "q": "The teacher ___ taught us English was very kind.", "a": ["who", "that"], "w": "Teacher adalah orang dan menjadi subjek, jadi who atau that."}, {"t": "fill", "q": "Jakarta, ___ is the capital of Indonesia, is very crowded.", "a": ["which"], "w": "Klausa non-defining untuk benda/tempat memakai which, bukan that."}, {"t": "fill", "q": "This is the school ___ my father studied.", "a": ["where"], "w": "School adalah tempat, jadi where."}, {"t": "order", "a": "The man who lives here is my uncle.", "id": "Pria yang tinggal di sini adalah pamanku."}, {"t": "order", "a": "This is the phone that I want to buy.", "id": "Ini adalah ponsel yang ingin saya beli.", "alt": ["This is the phone which I want to buy.", "This is the phone I want to buy."]}, {"t": "fix", "q": "The woman which works here is my aunt.", "a": ["The woman who works here is my aunt.", "The woman that works here is my aunt."], "w": "Untuk orang pakai who atau that, bukan which."}, {"t": "fix", "q": "I know a boy who his father is a pilot.", "a": ["I know a boy whose father is a pilot."], "w": "Kepemilikan memakai whose; his tidak diperlukan."}, {"t": "fix", "q": "My laptop, that I bought last year, is broken.", "a": ["My laptop, which I bought last year, is broken."], "w": "Klausa dengan koma tidak boleh memakai that."}, {"t": "fix", "q": "The book which I read it was great.", "a": ["The book which I read was great.", "The book that I read was great.", "The book I read was great."], "w": "Which sudah menjadi objek, jadi it tidak perlu diulang."}, {"t": "tr", "q": "Dia adalah wanita yang membantu saya kemarin.", "a": ["She is the woman who helped me yesterday.", "She is the woman that helped me yesterday.", "She was the woman who helped me yesterday.", "She was the woman that helped me yesterday."], "w": "Orang sebagai subjek memakai who atau that; helped karena kemarin."}, {"t": "tr", "q": "Ini adalah rumah tempat saya dibesarkan.", "a": ["This is the house where I grew up.", "This is the house in which I grew up.", "This is the house where I was raised."], "w": "Tempat memakai where atau in which."}, {"t": "tr", "q": "Saya punya teman yang ayahnya seorang dokter.", "a": ["I have a friend whose father is a doctor.", "I have a friend whose dad is a doctor."], "w": "Kepemilikan 'yang ayahnya' memakai whose."}, {"t": "tr", "q": "Buku yang kamu pinjam itu mahal.", "a": ["The book that you borrowed is expensive.", "The book which you borrowed is expensive.", "The book you borrowed is expensive.", "That book that you borrowed is expensive.", "That book which you borrowed is expensive.", "That book you borrowed is expensive."], "w": "Benda sebagai objek: that atau which, atau dihilangkan sama sekali."}]}, {"id": "g17", "title": "Reported Speech (direct → indirect)", "lvl": 4, "explain": "Reported speech menceritakan ulang ucapan orang tanpa tanda kutip. Kata kerja biasanya mundur satu tingkat waktu (backshift): am/is jadi was, will jadi would, can jadi could, V2 jadi had + V3. Pronomina dan keterangan waktu ikut berubah (today jadi that day). Pertanyaan memakai if/whether atau kata tanya dengan urutan kalimat biasa. Perintah memakai to + V1.", "formula": ["S + said (that) + S + V (mundur satu tingkat)", "S + asked + (O) + if/whether + S + V", "S + asked + (O) + wh-word + S + V", "S + told + O + (not) to + V1"], "examples": [["She said, \"I am tired.\" → She said that she was tired.", "Dia bilang bahwa dia lelah."], ["\"We will help you,\" they said. → They said that they would help me.", "Mereka bilang bahwa mereka akan membantu saya."], ["He asked me, \"Where do you live?\" → He asked me where I lived.", "Dia bertanya kepada saya di mana saya tinggal."], ["\"Do you like coffee?\" she asked. → She asked if I liked coffee.", "Dia bertanya apakah saya suka kopi."], ["\"Close the door,\" the teacher told us. → The teacher told us to close the door.", "Guru menyuruh kami menutup pintu."], ["\"I saw him,\" she said. → She said that she had seen him.", "Dia bilang bahwa dia telah melihatnya."]], "mistakes": [["She said me that she was busy.", "She told me that she was busy.", "Said tidak diikuti objek langsung; pakai told me atau said that."], ["He asked me where did I live.", "He asked me where I lived.", "Dalam reported question urutan kalimat biasa, tanpa did, dan kata kerja mundur."], ["The doctor told me don't eat sweets.", "The doctor told me not to eat sweets.", "Perintah negatif dilaporkan dengan not to + V1."], ["She said that she will come the next day.", "She said that she would come the next day.", "Will harus mundur menjadi would dalam reported speech."]], "items": [{"t": "mcq", "q": "She said, \"I am tired.\" → She said that she ___ tired.", "o": ["is", "was", "were", "has been"], "a": 1, "w": "Am/is mundur menjadi was; she berubah dari I."}, {"t": "mcq", "q": "\"We will help you,\" they said. → They said that they ___ help me.", "o": ["will", "would", "can", "did"], "a": 1, "w": "Will mundur menjadi would."}, {"t": "mcq", "q": "He asked me, \"Where do you live?\" → He asked me where I ___.", "o": ["live", "do live", "lived", "did live"], "a": 2, "w": "Urutan kalimat biasa dan present mundur menjadi past: lived."}, {"t": "mcq", "q": "\"Close the door,\" the teacher told us. → The teacher told us ___ the door.", "o": ["close", "to close", "closing", "that close"], "a": 1, "w": "Perintah dilaporkan dengan told + O + to + V1."}, {"t": "mcq", "q": "\"I saw him,\" she said. → She said that she ___ him.", "o": ["had seen", "has seen", "sees", "will see"], "a": 0, "w": "Past simple mundur menjadi past perfect: had seen."}, {"t": "mcq", "q": "\"Do you like coffee?\" he asked. → He asked me ___ coffee.", "o": ["if I liked", "that I liked", "did I like", "do I like"], "a": 0, "w": "Pertanyaan ya/tidak memakai if atau whether dengan urutan kalimat biasa."}, {"t": "mcq", "q": "\"I can swim,\" Rina said. → Rina said that she ___ swim.", "o": ["can", "could", "would", "was"], "a": 1, "w": "Can mundur menjadi could."}, {"t": "fill", "q": "\"I am hungry,\" Tom said. → Tom said that he ___ hungry.", "a": ["was"], "w": "Am mundur menjadi was."}, {"t": "fill", "q": "\"I can swim,\" she said. → She said she ___ swim.", "a": ["could"], "w": "Can mundur menjadi could."}, {"t": "fill", "q": "\"Are you ready?\" he asked. → He asked me ___ I was ready.", "a": ["if", "whether"], "w": "Pertanyaan ya/tidak dilaporkan dengan if atau whether."}, {"t": "order", "a": "She said that she was tired.", "id": "Dia bilang bahwa dia lelah."}, {"t": "order", "a": "He asked me where I lived.", "id": "Dia bertanya kepada saya di mana saya tinggal."}, {"t": "fix", "q": "She said me that she was busy.", "a": ["She told me that she was busy.", "She said that she was busy."], "w": "Said tidak langsung diikuti objek; gunakan told me ata
